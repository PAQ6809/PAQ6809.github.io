name: ReelScribe native build validation

on:
  push:
    paths:
      - "reelscribe-mobile/package.json"
      - "reelscribe-mobile/scripts/bootstrap.sh"
      - "reelscribe-mobile/scripts/bootstrap.ps1"
      - "reelscribe-mobile/native/**"
      - ".github/workflows/reelscribe-mobile-native-build.yml"
  pull_request:
    paths:
      - "reelscribe-mobile/package.json"
      - "reelscribe-mobile/scripts/bootstrap.sh"
      - "reelscribe-mobile/scripts/bootstrap.ps1"
      - "reelscribe-mobile/native/**"
      - ".github/workflows/reelscribe-mobile-native-build.yml"
  workflow_dispatch:

concurrency:
  group: reelscribe-native-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate environment
        run: |
          set -euo pipefail
          java -version
          node --version
          npm --version

      - name: Generate native projects and install dependencies
        working-directory: reelscribe-mobile
        run: bash scripts/bootstrap.sh

      - name: Build unsigned Android debug APK
        working-directory: reelscribe-mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload Android debug artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reelscribe-android-debug
          path: reelscribe-mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Generate native projects and install dependencies
        working-directory: reelscribe-mobile
        run: bash scripts/bootstrap.sh

      - name: Install iOS pods
        working-directory: reelscribe-mobile/ios
        run: pod install --repo-update

      - name: Build unsigned iOS simulator app
        working-directory: reelscribe-mobile/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ReelScribeMobile.xcworkspace \
            -scheme ReelScribeMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Debug-iphonesimulator/ReelScribeMobile.app \
            build/ReelScribeMobile-simulator.zip

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reelscribe-ios-simulator
          path: reelscribe-mobile/ios/build/ReelScribeMobile-simulator.zip
          if-no-files-found: error
          retention-days: 7

name: ReelScribe native build

on:
  push:
    paths:
      - "reelscribe-mobile/**"
      - "reelscribe/models/mobile-model-catalog.json"
      - ".github/workflows/reelscribe-native-build.yml"
  pull_request:
    paths:
      - "reelscribe-mobile/**"
      - "reelscribe/models/mobile-model-catalog.json"
      - ".github/workflows/reelscribe-native-build.yml"
  workflow_dispatch:

concurrency:
  group: reelscribe-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install exact app dependencies
        working-directory: reelscribe-mobile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run source, catalog and store preflight checks
        working-directory: reelscribe-mobile
        run: npm run check

      - name: Verify app-owned native manager autolinking
        working-directory: reelscribe-mobile
        run: |
          set -euo pipefail
          test -s native/reelscribe-manager/package.json
          test -s native/reelscribe-manager/ReelScribeManager.podspec
          test -s native/reelscribe-manager/ios/ReelScribeManager.swift
          test -s native/reelscribe-manager/android/src/main/java/io/github/paq6809/reelscribe/manager/ReelScribeManagerModule.kt
          grep -q 'file:./native/reelscribe-manager' package.json
          npx react-native config > /tmp/react-native-config.json
          grep -q '@reelscribe/native-manager' /tmp/react-native-config.json
          grep -q 'whisper.rn' /tmp/react-native-config.json

  android-debug:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@c3d7ccbf814deadecbf6b21833020d5dc5c8eaf9
        with:
          distribution: temurin
          java-version: "17"

      - name: Bootstrap React Native Android project
        working-directory: reelscribe-mobile
        run: |
          chmod +x scripts/bootstrap.sh
          ./scripts/bootstrap.sh

      - name: Build unsigned debug APK
        working-directory: reelscribe-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reelscribe-react-native-android-debug
          path: reelscribe-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Bootstrap React Native iOS project
        working-directory: reelscribe-mobile
        run: |
          chmod +x scripts/bootstrap.sh
          ./scripts/bootstrap.sh
          cd ios
          pod install --repo-update

      - name: Build unsigned simulator application
        working-directory: reelscribe-mobile
        run: |
          xcodebuild \
            -workspace ios/ReelScribeMobile.xcworkspace \
            -scheme ReelScribeMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

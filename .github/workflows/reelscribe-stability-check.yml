name: ReelScribe stability check

on:
  push:
    paths:
      - "reelscribe/format-compat.js"
      - "reelscribe/runtime-optimizer.js"
      - "reelscribe/app.js"
      - "reelscribe/ui.js"
      - "reelscribe/instagram-direct.js"
      - "reelscribe/screen-ocr.js"
      - "reelscribe/sw.js"
      - "tests/reelscribe-stability-audit.mjs"
      - "tests/reelscribe-youtube-quality-audit.mjs"
      - "tests/reelscribe-ocr-quality-audit.mjs"
      - ".github/workflows/reelscribe-stability-check.yml"
  pull_request:
    paths:
      - "reelscribe/format-compat.js"
      - "reelscribe/runtime-optimizer.js"
      - "reelscribe/app.js"
      - "reelscribe/ui.js"
      - "reelscribe/instagram-direct.js"
      - "reelscribe/screen-ocr.js"
      - "reelscribe/sw.js"
      - "tests/reelscribe-stability-audit.mjs"
      - "tests/reelscribe-youtube-quality-audit.mjs"
      - "tests/reelscribe-ocr-quality-audit.mjs"
      - ".github/workflows/reelscribe-stability-check.yml"
  schedule:
    - cron: "45 1 * * 1,4"
  workflow_dispatch:

concurrency:
  group: reelscribe-stability-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Check runtime JavaScript syntax
        run: |
          set -euo pipefail
          node --check reelscribe/format-compat.js
          node --check reelscribe/runtime-optimizer.js
          node --check reelscribe/app.js
          node --check reelscribe/ui.js
          node --check reelscribe/instagram-direct.js
          node --check reelscribe/screen-ocr.js
          node --check reelscribe/sw.js
          node --check tests/reelscribe-stability-audit.mjs
          node --check tests/reelscribe-youtube-quality-audit.mjs
          node --check tests/reelscribe-ocr-quality-audit.mjs

      - name: Run renderer stability audit
        run: |
          node tests/reelscribe-stability-audit.mjs
          node tests/reelscribe-youtube-quality-audit.mjs
          node tests/reelscribe-ocr-quality-audit.mjs

      - name: Check YouTube captions endpoint contract
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/youtube-endpoint.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"url":"invalid","language":"auto"}' \
            --max-time 30 \
            https://vite-xi-one-59.vercel.app/api/youtube-captions)
          test "$status" = "400"
          grep -q 'INVALID_REQUEST' /tmp/youtube-endpoint.json

      - name: Enforce read-only and pinned actions
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/reelscribe-stability-check.yml').read_text(encoding='utf-8')
          assert re.search(r'^permissions:\s*\n\s+contents:\s+read\s*$', workflow, flags=re.M)
          for value in re.findall(r'^\s*uses:\s*([^\s#]+)', workflow, flags=re.M):
              if value.startswith('./'):
                  continue
              assert re.search(r'@[0-9a-f]{40}$', value), value
          PY
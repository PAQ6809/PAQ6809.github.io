name: ReelScribe PR diagnostics

on:
  pull_request:
    paths:
      - "reelscribe/**"
      - "reelscribe-mobile/**"
      - "tests/reelscribe-*.mjs"
      - ".github/workflows/reelscribe-*.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Capture complete diagnostics
        run: |
          mkdir -p diagnostics
          set +e
          node tests/reelscribe-audit.mjs >diagnostics/web-audit.log 2>&1; echo $? >diagnostics/web-audit.status
          node tests/reelscribe-stability-audit.mjs >diagnostics/stability-audit.log 2>&1; echo $? >diagnostics/stability-audit.status
          node tests/reelscribe-youtube-audit.mjs >diagnostics/youtube-audit.log 2>&1; echo $? >diagnostics/youtube-audit.status
          node tests/reelscribe-ocr-audit.mjs >diagnostics/ocr-audit.log 2>&1; echo $? >diagnostics/ocr-audit.status
          node reelscribe-mobile/scripts/audit-model-catalog.mjs >diagnostics/catalog-normal.log 2>&1; echo $? >diagnostics/catalog-normal.status
          RELEASE_BUILD=1 node reelscribe-mobile/scripts/audit-model-catalog.mjs >diagnostics/catalog-release.log 2>&1; echo $? >diagnostics/catalog-release.status
          node reelscribe-mobile/scripts/preflight-store.mjs >diagnostics/store-preflight.log 2>&1; echo $? >diagnostics/store-preflight.status
          set -e

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reelscribe-pr-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 1

      - name: Fail when a diagnostic failed
        run: |
          python - <<'PY'
          from pathlib import Path
          failed = []
          for path in sorted(Path('diagnostics').glob('*.status')):
              if path.read_text().strip() != '0':
                  failed.append(path.stem)
          if failed:
              raise SystemExit('Failed diagnostics: ' + ', '.join(failed))
          print('All ReelScribe diagnostics passed.')
          PY

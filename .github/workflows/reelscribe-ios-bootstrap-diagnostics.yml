name: ReelScribe iOS bootstrap diagnostics

on:
  pull_request:
    paths:
      - "reelscribe-mobile/**"
      - ".github/workflows/reelscribe-ios-bootstrap-diagnostics.yml"

permissions:
  contents: read

jobs:
  ios-bootstrap:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Capture bootstrap output
        run: |
          mkdir -p diagnostics
          set +e
          bash reelscribe-mobile/scripts/bootstrap.sh >diagnostics/ios-bootstrap.log 2>&1
          status=$?
          echo "$status" >diagnostics/ios-bootstrap.status
          set -e

      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reelscribe-ios-bootstrap-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 1

      - name: Fail when bootstrap failed
        run: test "$(cat diagnostics/ios-bootstrap.status)" = "0"

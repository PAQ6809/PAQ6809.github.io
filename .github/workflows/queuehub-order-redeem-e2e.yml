name: QueueHub Order QR Redeem E2E

on:
  workflow_dispatch:
    inputs:
      test_token:
        description: 'Short-lived test token already seeded in queuehub_order_qr_tokens'
        required: true
        type: string
      expected_ticket:
        description: 'Expected ticket number'
        required: true
        default: '991'
        type: string

permissions:
  contents: read

jobs:
  redeem-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_URL: https://goedzzhhvvnfczgnkqlv.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_6whjqbImNMa7BR9i-96M-w_dFIOFeMN
      TEST_TOKEN: ${{ inputs.test_token }}
      EXPECTED_TICKET: ${{ inputs.expected_ticket }}
    steps:
      - name: Redeem short-lived test token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            -X POST "$SUPABASE_URL/functions/v1/queuehub-order-redeem" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Origin: https://paq6809.github.io" \
            -H 'Content-Type: application/json' \
            --data "{\"token\":\"$TEST_TOKEN\"}")"
          RESPONSE="$response" python3 - <<'PY'
          import json, os
          d = json.loads(os.environ['RESPONSE'])
          assert d['ok'] is True
          assert d['restaurantSlug'] == 'harbor-noodles'
          assert d['ticketNumber'] == int(os.environ['EXPECTED_TICKET'])
          assert d['queueSessionId']
          assert d['expiresAt']
          print('Secure order QR redemption E2E: PASS')
          PY

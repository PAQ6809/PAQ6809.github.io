name: ReelScribe mobile build

on:
  push:
    paths:
      - "mobile/**"
      - "reelscribe/**"
      - ".github/workflows/reelscribe-mobile-build.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "reelscribe/**"
      - ".github/workflows/reelscribe-mobile-build.yml"
  workflow_dispatch:

concurrency:
  group: reelscribe-mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install pinned dependencies
        working-directory: mobile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify native bridge and model catalog
        working-directory: mobile
        run: npm run verify

      - name: Build native web bundle
        working-directory: mobile
        run: npm run sync:web

      - name: Reject sensitive material
        run: |
          set -euo pipefail
          ! grep -RIE --exclude='*.md' --exclude='package-lock.json' \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|APPLE_API_PRIVATE_KEY|ANDROID_KEYSTORE_PASSWORD|PLAY_SERVICE_ACCOUNT_JSON)' \
            mobile
          ! grep -RIE --exclude='*.md' --exclude='package-lock.json' \
            '(document\.cookie|new Function\s*\(|(^|[^[:alnum:]_])eval\s*\()' \
            mobile/src mobile/scripts

  android-debug:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dependencies and generate Android project
        working-directory: mobile
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run sync:web
          npx cap add android
          npx cap sync android

      - name: Build unsigned debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reelscribe-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dependencies and generate iOS project
        working-directory: mobile
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run sync:web
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned iOS simulator app
        working-directory: mobile
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

name: QueueHub Runtime Syntax Report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/queuehub-runtime-report.yml'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build syntax report
        shell: bash
        run: |
          set +e
          mkdir -p queuehub/project/diagnostics
          report=queuehub/project/diagnostics/runtime-syntax-report.txt
          : > "$report"
          failed=0
          while IFS= read -r -d '' file; do
            output="$(node --check "$file" 2>&1)"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              failed=1
              {
                echo "FAIL: $file"
                printf '%s\n' "$output"
                echo "---"
              } >> "$report"
            fi
          done < <(find queuehub/src -type f -name '*.js' -print0 | sort -z)
          output="$(node --check queuehub/sw.js 2>&1)"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            failed=1
            {
              echo "FAIL: queuehub/sw.js"
              printf '%s\n' "$output"
              echo "---"
            } >> "$report"
          fi
          if [ "$failed" -eq 0 ]; then
            echo 'PASS: all QueueHub browser JavaScript parses successfully.' > "$report"
          fi
          cat "$report"
      - name: Commit temporary report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add queuehub/project/diagnostics/runtime-syntax-report.txt
          git diff --cached --quiet && exit 0
          git commit -m 'ci(queuehub): record temporary runtime syntax report'
          git push origin HEAD:main

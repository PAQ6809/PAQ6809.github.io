name: ReelScribe Android build diagnostics

on:
  pull_request:
    paths:
      - "reelscribe-mobile/**"
      - ".github/workflows/reelscribe-android-build-diagnostics.yml"

permissions:
  contents: read

jobs:
  android-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@174d4b5609ee770b8b444d3be0ecdbf3eea65661 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Capture bootstrap and Gradle output
        run: |
          mkdir -p diagnostics
          set +e
          bash reelscribe-mobile/scripts/bootstrap.sh >diagnostics/android-bootstrap.log 2>&1
          bootstrap_status=$?
          echo "$bootstrap_status" >diagnostics/android-bootstrap.status

          if [ "$bootstrap_status" = "0" ]; then
            (cd reelscribe-mobile/android && ./gradlew assembleDebug --stacktrace --no-daemon) >diagnostics/gradle-build.log 2>&1
            gradle_status=$?
          else
            echo "Skipped because bootstrap failed." >diagnostics/gradle-build.log
            gradle_status=99
          fi
          echo "$gradle_status" >diagnostics/gradle-build.status
          set -e

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reelscribe-android-build-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 1

      - name: Fail when bootstrap or Gradle failed
        run: |
          test "$(cat diagnostics/android-bootstrap.status)" = "0"
          test "$(cat diagnostics/gradle-build.status)" = "0"

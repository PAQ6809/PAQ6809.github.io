name: ReelScribe model integrity

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Space-separated approved model IDs; default locks the mobile v1 candidates"
        required: false
        default: "whisper-tiny whisper-base"

permissions:
  contents: read

concurrency:
  group: reelscribe-model-integrity
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Resolve exact bytes and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          read -r -a models <<< "${{ inputs.models }}"
          allowed='^(whisper-tiny|whisper-base|whisper-small|whisper-large-v3-turbo)$'
          for model in "${models[@]}"; do
            [[ "$model" =~ $allowed ]] || { echo "Unapproved model ID: $model" >&2; exit 1; }
          done
          node reelscribe-mobile/scripts/resolve-model-integrity.mjs "${models[@]}"

      - name: Upload review-only integrity report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reelscribe-model-integrity-report
          path: reelscribe-mobile/integrity-output/model-integrity-report.json
          if-no-files-found: error
          retention-days: 14

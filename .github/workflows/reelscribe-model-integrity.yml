name: ReelScribe model integrity

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Space-separated approved model IDs; default locks the mobile v1 candidates"
        required: false
        default: "whisper-tiny whisper-base"

permissions:
  contents: read

concurrency:
  group: reelscribe-model-integrity
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Resolve exact bytes and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          read -r -a models <<< "${{ inputs.models }}"
          allowed='^(whisper-tiny|whisper-base|whisper-small|whisper-large-v3-turbo)$'
          for model in "${models[@]}"; do
            [[ "$model" =~ $allowed ]] || { echo "Unapproved model ID: $model" >&2; exit 1; }
          done
          node reelscribe-mobile/scripts/resolve-model-integrity.mjs "${models[@]}"

      - name: Upload review-only integrity report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reelscribe-model-integrity-report
          path: reelscribe-mobile/integrity-output/model-integrity-report.json
          if-no-files-found: error
          retention-days: 14

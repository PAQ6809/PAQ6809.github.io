name: Lumen static checks

on:
  push:
    paths:
      - 'taiex-trend-dashboard/**'
      - '.github/workflows/lumen-static-check.yml'
  pull_request:
    paths:
      - 'taiex-trend-dashboard/**'
      - '.github/workflows/lumen-static-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          for file in \
            taiex-trend-dashboard/lumen.js \
            taiex-trend-dashboard/lumen-core.js \
            taiex-trend-dashboard/lumen-market.js \
            taiex-trend-dashboard/lumen-stock-a.js \
            taiex-trend-dashboard/lumen-stock-b.js \
            taiex-trend-dashboard/lumen-derivatives.js \
            taiex-trend-dashboard/lumen-workspace.js \
            taiex-trend-dashboard/lumen-cloud.js \
            taiex-trend-dashboard/lumen-boot.js
          do
            node --check "$file"
          done

      - name: Validate complete Lumen data and interaction contract
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          root = Path('taiex-trend-dashboard')
          modules = [
              'lumen-core.js',
              'lumen-market.js',
              'lumen-stock-a.js',
              'lumen-stock-b.js',
              'lumen-derivatives.js',
              'lumen-workspace.js',
              'lumen-cloud.js',
              'lumen-boot.js',
          ]
          required_files = [
              root / 'index.html',
              root / 'lumen.css',
              root / 'lumen.js',
              root / 'source-manifest.json',
              root / 'qa-contract.json',
              root / 'maintenance-latest.json',
              root / 'official-snapshot-latest.json',
              root / 'README.md',
              root / 'REFRACTOR-STATUS.md',
              *[root / name for name in modules],
          ]
          missing = [str(p) for p in required_files if not p.exists()]
          if missing:
              raise SystemExit(f'Missing required Lumen files: {missing}')

          obsolete = root / 'lumen-runtime-fixes.js'
          if obsolete.exists():
              raise SystemExit('Obsolete duplicate runtime patch still exists')

          html = (root / 'index.html').read_text(encoding='utf-8')
          loader = (root / 'lumen.js').read_text(encoding='utf-8')
          module_text = {name: (root / name).read_text(encoding='utf-8') for name in modules}
          combined = '\n'.join(module_text.values())

          required_ids = [
              'nav', 'marketDate', 'fetchTime', 'sourceHealth',
              'marketKpis', 'indexRows', 'marketSentiment', 'hotRows', 'hotSource',
              'stockSearch', 'stockSearchButton', 'stockDetail', 'stockKpis', 'stockTabs', 'stockPanel',
              'etfRows', 'etfSource',
              'marginListed', 'marginOtc', 'taifexInstitutional', 'putCallPanel',
              'workspaceSelect', 'watchList', 'workspaceNote', 'sourceCards', 'workList'
          ]
          missing_ids = [x for x in required_ids if f'id="{x}"' not in html]
          if missing_ids:
              raise SystemExit(f'Missing required DOM ids: {missing_ids}')

          if './lumen.css' not in html or './lumen.js' not in html:
              raise SystemExit('index.html is missing the canonical CSS or JS loader')
          if 'lumen-runtime-fixes.js' in html:
              raise SystemExit('index.html still references obsolete runtime patch')
          if re.search(r'href=["\']javascript:', html, flags=re.I):
              raise SystemExit('javascript: links are forbidden')

          missing_modules = [name for name in modules if f'./{name}' not in loader]
          if missing_modules:
              raise SystemExit(f'Loader is missing canonical modules: {missing_modules}')
          positions = [loader.index(f'./{name}') for name in modules]
          if positions != sorted(positions):
              raise SystemExit('Canonical modules are not loaded in dependency order')

          manifest = json.loads((root / 'source-manifest.json').read_text(encoding='utf-8'))
          qa = json.loads((root / 'qa-contract.json').read_text(encoding='utf-8'))
          maintenance = json.loads((root / 'maintenance-latest.json').read_text(encoding='utf-8'))
          snapshot = json.loads((root / 'official-snapshot-latest.json').read_text(encoding='utf-8'))

          policy = manifest.get('policy', {})
          required_policy = [
              'financial_values_require_source', 'show_source_data_date',
              'show_fetch_timestamp', 'no_silent_fallback'
          ]
          if not all(policy.get(k) is True for k in required_policy):
              raise SystemExit('Source transparency policy is incomplete or disabled')

          primary = {s.get('name') for s in manifest.get('sources', []) if s.get('authority') == 'primary'}
          required_primary = {'TWSE OpenAPI', 'Taipei Exchange OpenAPI', 'MOPS', 'TAIFEX OpenAPI'}
          if not required_primary.issubset(primary):
              raise SystemExit(f'Missing primary financial sources: {required_primary-primary}')

          manifest_text = json.dumps(manifest, ensure_ascii=False)
          required_domains = ['openapi.twse.com.tw', 'www.tpex.org.tw', 'mops.twse.com.tw', 'openapi.taifex.com.tw']
          missing_domains = [domain for domain in required_domains if domain not in manifest_text]
          if missing_domains:
              raise SystemExit(f'Missing official source domains: {missing_domains}')

          required_contracts = [
              r'PutCallRatio',
              r'MarketDataOfMajorInstitutionalTradersGeneralBytheDate',
              r'mopsfin_t187ap05_O',
              r'T86',
              r'LocalStorage|localStorage',
              r'lumen_workspaces',
              r'auth\.signInWithPassword',
              r'normalizeHistoryRows',
              r'official-snapshot-latest\.json',
              r'snapshotFallback',
          ]
          missing_contracts = [pattern for pattern in required_contracts if not re.search(pattern, combined + manifest_text)]
          if missing_contracts:
              raise SystemExit(f'Missing Lumen runtime/source contracts: {missing_contracts}')

          expected_views = qa.get('views', [])
          missing_views = [view for view in expected_views if f'id="view-{view}"' not in html]
          if missing_views:
              raise SystemExit(f'QA contract views missing from HTML: {missing_views}')

          boot = module_text['lumen-boot.js']
          for control in qa.get('static_controls', []):
              cid = control['id']
              event = control['event']
              if f'id="{cid}"' not in html:
                  raise SystemExit(f'QA control missing from HTML: {cid}')
              binding = re.compile(rf"getElementById\(['\"]{re.escape(cid)}['\"]\)\.addEventListener\(['\"]{re.escape(event)}['\"]")
              if not binding.search(boot):
                  raise SystemExit(f'QA control is not bound to expected event {event}: {cid}')

          core = module_text['lumen-core.js']
          stock_a = module_text['lumen-stock-a.js']
          stock_b = module_text['lumen-stock-b.js']
          if "querySelectorAll('#nav button,[data-view]')" not in core:
              raise SystemExit('Dynamic [data-view] navigation binding is missing')
          if "querySelectorAll('#stockTabs [data-tab]')" not in stock_a:
              raise SystemExit('Dynamic stock-tab binding is missing')
          if "#stockPanel [data-stock]" not in stock_b:
              raise SystemExit('Dynamic stock-row navigation binding is missing')
          if '[data-go="derivatives"]' not in stock_b:
              raise SystemExit('Derivatives navigation control is missing')

          for tab, renderer in qa.get('stock_tabs', {}).items():
              if f"['{tab}'" not in stock_a and f'{tab}:' not in stock_a:
                  raise SystemExit(f'Stock tab missing: {tab}')
              if not re.search(rf'\b{re.escape(renderer)}\s*\(', combined) and renderer not in stock_a:
                  raise SystemExit(f'Stock tab renderer missing: {tab} -> {renderer}')

          required_categories = {
              'official_daily_quote_and_OHLC', 'six_month_official_price_history',
              'MA5_MA20_MA60', 'RSI14', 'MACD_and_signal',
              'company_profile_and_industry', 'monthly_revenue',
              'income_statement_summary', 'balance_sheet_summary',
              'PE_ratio', 'PB_ratio', 'dividend_yield',
              'institutional_trading_data', 'official_material_information',
              'raw_primary_source_links', 'explicit_missing_or_failure_state',
              'verified_scheduled_snapshot_fallback'
          }
          categories = set(qa.get('stock_information_categories', []))
          if not required_categories.issubset(categories):
              raise SystemExit(f'QA stock-information coverage incomplete: {required_categories-categories}')

          link_policy = qa.get('link_policy', {})
          if not link_policy.get('financial_links_must_be_https'):
              raise SystemExit('HTTPS financial-link policy must be enabled')
          if not link_policy.get('external_target_blank_requires_noopener_noreferrer'):
              raise SystemExit('noopener/noreferrer policy must be enabled')
          if not link_policy.get('javascript_links_forbidden'):
              raise SystemExit('javascript-link prohibition must be enabled')

          for domain in link_policy.get('primary_domains', []):
              if domain not in combined + manifest_text:
                  raise SystemExit(f'QA primary domain not represented in runtime/manifest: {domain}')

          blank_tags = re.findall(r'<a\b[^>]*target=["\']_blank["\'][^>]*>', html + combined, flags=re.I)
          unsafe_blank = [tag for tag in blank_tags if not re.search(r'rel=["\'][^"\']*noopener[^"\']*noreferrer[^"\']*["\']', tag, flags=re.I)]
          if unsafe_blank:
              raise SystemExit(f'External _blank links missing noopener noreferrer: {unsafe_blank[:3]}')

          if not maintenance.get('run_at'):
              raise SystemExit('maintenance-latest.json must record run_at')
          if maintenance.get('project_identity', {}).get('canonical_repo_path') != 'PAQ6809/PAQ6809.github.io/taiex-trend-dashboard/':
              raise SystemExit('maintenance record points to the wrong canonical project')

          snapshot_policy = qa.get('snapshot_policy', {})
          required_snapshot_rules = [
              'live_official_api_has_priority',
              'fallback_requires_empty_live_dataset',
              'fallback_requires_verified_status',
              'fallback_requires_nonempty_rows',
              'unverified_datasets_must_not_backfill',
              'financial_rows_must_be_from_canonical_official_source',
              'source_url_required',
              'source_data_date_required_for_verified_financial_rows',
              'snapshot_run_at_required',
              'macro_calendar_requires_official_source',
              'macro_calendar_must_not_predict_release_values'
          ]
          if not all(snapshot_policy.get(k) is True for k in required_snapshot_rules):
              raise SystemExit('Verified snapshot safety policy is incomplete')
          if not snapshot.get('run_at') or not isinstance(snapshot.get('datasets'), dict):
              raise SystemExit('Official snapshot is missing run_at or datasets')
          snapshot_root_policy = snapshot.get('policy', {})
          if not all(snapshot_root_policy.get(k) is True for k in [
              'official_only_for_financial_values',
              'fallback_only_when_live_dataset_empty',
              'unverified_datasets_never_used_as_fallback',
              'source_date_and_snapshot_time_are_separate'
          ]):
              raise SystemExit('Official snapshot root policy is incomplete')
          for key, dataset in snapshot.get('datasets', {}).items():
              status = dataset.get('status')
              rows = dataset.get('rows')
              if not isinstance(rows, list):
                  raise SystemExit(f'Snapshot dataset rows must be a list: {key}')
              if status == 'verified':
                  if not rows:
                      raise SystemExit(f'Verified snapshot dataset cannot be empty: {key}')
                  if not dataset.get('source_url') or not dataset.get('data_date'):
                      raise SystemExit(f'Verified snapshot dataset lacks source URL/data date: {key}')
              elif rows:
                  raise SystemExit(f'Unverified snapshot dataset must not carry financial rows: {key}')

          failure_policy = qa.get('maintenance_failure_policy', {})
          required_fail_rules = [
              'do_not_guess_missing_financial_values',
              'do_not_mark_healthy_when_required_check_fails',
              'record_failed_control_or_source',
              'record_source_data_date_and_fetch_time_separately'
          ]
          if not all(failure_policy.get(k) is True for k in required_fail_rules):
              raise SystemExit('Maintenance failure policy is incomplete')

          forbidden = [
              r'SUPABASE_SERVICE_ROLE_KEY',
              r'sb_secret_',
              r'postgres(?:ql)?://',
          ]
          leaked = [pattern for pattern in forbidden if re.search(pattern, combined)]
          if leaked:
              raise SystemExit(f'Frontend contains forbidden server-side credential pattern: {leaked}')

          print('Lumen complete data + interaction QA contract OK')

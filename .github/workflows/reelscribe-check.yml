name: ReelScribe quality check

on:
  push:
    paths:
      - "reelscribe/**"
      - "tests/reelscribe-audit.mjs"
      - "robots.txt"
      - "SECURITY.md"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - ".github/workflows/reelscribe-check.yml"
      - "023a07a03f89a9a325ac29506c5f91e19fda61e84ca32ed0c7d6299901a07ca1.txt"
  pull_request:
    paths:
      - "reelscribe/**"
      - "tests/reelscribe-audit.mjs"
      - "robots.txt"
      - "SECURITY.md"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - ".github/workflows/reelscribe-check.yml"
  schedule:
    - cron: "15 1 * * 1,4"
  workflow_dispatch:

concurrency:
  group: reelscribe-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check reelscribe/format-compat.js
          node --check reelscribe/speech-enhancer.js
          node --check reelscribe/app.js
          node --check reelscribe/runtime-optimizer.js
          node --check reelscribe/screen-ocr.js
          node --check reelscribe/capture.js
          node --check reelscribe/traditional.js
          node --check reelscribe/instagram-direct.js
          node --check reelscribe/universal-link.js
          node --check reelscribe/ui.js
          node --check reelscribe/share.js
          node --check tests/reelscribe-audit.mjs
          cp reelscribe/worker.js /tmp/reelscribe-worker.mjs
          node --check /tmp/reelscribe-worker.mjs
          node --check reelscribe/sw.js

      - name: Run dependency-free functional audit
        run: node tests/reelscribe-audit.mjs

      - name: Validate manifest, sitemap and structured data
        run: |
          set -euo pipefail
          python -m json.tool reelscribe/manifest.webmanifest >/dev/null
          python - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ET.parse("reelscribe/sitemap.xml")
          html = Path("reelscribe/index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="application/ld\+json">([\s\S]*?)</script>', html)
          assert match, "Missing JSON-LD"
          data = json.loads(match.group(1))
          assert data.get("@type") == "SoftwareApplication"
          features = data.get("featureList", [])
          assert any("背景音樂" in item for item in features)
          assert any("OCR" in item for item in features)
          assert any("背景模型" in item for item in features)
          PY

      - name: Validate HTML and CSS structure
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class Parser(HTMLParser):
              pass

          for path in ["reelscribe/index.html", "reelscribe/supported-platforms.html"]:
              html = Path(path).read_text(encoding="utf-8")
              Parser().feed(html)
              ids = re.findall(r'\sid=["\']([^"\']+)["\']', html)
              assert len(ids) == len(set(ids)), f"Duplicate HTML ids: {path}"

          for path in ["reelscribe/styles.css", "reelscribe/ui-polish.css", "reelscribe/runtime.css"]:
              css = Path(path).read_text(encoding="utf-8")
              assert css.count("{") == css.count("}"), f"Unbalanced CSS braces: {path}"
          PY

      - name: Confirm app, preload, OCR and security wiring
        run: |
          set -euo pipefail
          files=(
            reelscribe/index.html reelscribe/supported-platforms.html
            reelscribe/styles.css reelscribe/ui-polish.css reelscribe/runtime.css
            reelscribe/OPTIMIZATION.md reelscribe/PROMOTION.md reelscribe/README.md
            reelscribe/sitemap.xml reelscribe/social-card.svg
            robots.txt SECURITY.md .github/CODEOWNERS .github/dependabot.yml
            reelscribe/format-compat.js reelscribe/speech-enhancer.js reelscribe/app.js
            reelscribe/runtime-optimizer.js reelscribe/screen-ocr.js
            reelscribe/capture.js reelscribe/traditional.js reelscribe/instagram-direct.js
            reelscribe/universal-link.js reelscribe/ui.js reelscribe/share.js
            reelscribe/worker.js reelscribe/sw.js tests/reelscribe-audit.mjs
          )
          for file in "${files[@]}"; do test -s "$file"; done

          grep -q './runtime.css' reelscribe/index.html
          grep -q './runtime-optimizer.js' reelscribe/index.html
          grep -q './screen-ocr.js' reelscribe/index.html
          grep -q 'id="model-cache-status"' reelscribe/index.html
          grep -q 'id="start-screen-ocr"' reelscribe/index.html
          grep -q 'id="suppress-music"' reelscribe/index.html

          grep -q 'APP_BUILD = "2026.07.13.7"' reelscribe/app.js
          grep -q 'function prepareModel' reelscribe/app.js
          grep -q 'function setStoragePolicy' reelscribe/app.js
          grep -q 'function mergeExternalSegments' reelscribe/app.js
          grep -q 'cacheAllowed' reelscribe/app.js
          grep -q 'registration.waiting' reelscribe/app.js
          grep -q 'updateViaCache: "none"' reelscribe/app.js
          ! grep -q 'controllerchange' reelscribe/app.js
          ! grep -q 'window.location.reload' reelscribe/app.js

          grep -q 'navigator.storage.estimate' reelscribe/runtime-optimizer.js
          grep -q 'navigator.storage.persist' reelscribe/runtime-optimizer.js
          grep -q 'requestIdleCallback' reelscribe/runtime-optimizer.js
          grep -q 'saveData' reelscribe/runtime-optimizer.js
          grep -q 'clearModelCaches' reelscribe/runtime-optimizer.js
          grep -q 'MOBILE_PREFETCH_MIN' reelscribe/runtime-optimizer.js
          grep -q 'DESKTOP_PREFETCH_MIN' reelscribe/runtime-optimizer.js

          grep -q 'TESSERACT_VERSION = "7.0.0"' reelscribe/screen-ocr.js
          grep -q 'Tesseract.createWorker' reelscribe/screen-ocr.js
          grep -q 'cacheMethod' reelscribe/screen-ocr.js
          grep -q 'MAX_MOBILE_FRAMES = 60' reelscribe/screen-ocr.js
          grep -q 'worker.recognize' reelscribe/screen-ocr.js
          grep -q 'worker.terminate' reelscribe/screen-ocr.js
          grep -q 'mergeExternalSegments' reelscribe/screen-ocr.js
          grep -q 'chi_tra' reelscribe/screen-ocr.js

          grep -q 'VAD_VERSION = "0.0.30"' reelscribe/speech-enhancer.js
          grep -q 'NonRealTimeVAD' reelscribe/speech-enhancer.js
          grep -q 'model: "v5"' reelscribe/speech-enhancer.js
          grep -q 'buildFrameMask' reelscribe/speech-enhancer.js

          grep -q 'FLAGSHIP_MODEL = "onnx-community/whisper-large-v3-turbo"' reelscribe/worker.js
          grep -q 'ACCURATE_MODEL = "onnx-community/whisper-small"' reelscribe/worker.js
          grep -q 'message.type === "prepare"' reelscribe/worker.js
          grep -q 'smallestRepeatingUnit' reelscribe/worker.js
          grep -q 'repetition_penalty: 1.2' reelscribe/worker.js
          grep -q 'no_repeat_ngram_size: 3' reelscribe/worker.js

          grep -q 'QUALITY_BUILD = "2026.07.13.7"' reelscribe/ui.js
          grep -q 'ReelScribeQualityGuard' reelscribe/ui.js
          ! grep -q 'controllerchange' reelscribe/ui.js
          ! grep -q 'window.location.reload' reelscribe/ui.js

          grep -q 'reelscribe-shell-v13' reelscribe/sw.js
          grep -q './runtime.css' reelscribe/sw.js
          grep -q './runtime-optimizer.js' reelscribe/sw.js
          grep -q './screen-ocr.js' reelscribe/sw.js
          grep -q 'async function networkFirst' reelscribe/sw.js
          ! grep -q 'skipWaiting' reelscribe/sw.js
          ! grep -q 'clients.claim' reelscribe/sw.js

          grep -q '/api/instagram-resolve' reelscribe/instagram-direct.js
          grep -q '/api/instagram-yt' reelscribe/instagram-direct.js
          grep -q 'credentials: "omit"' reelscribe/instagram-direct.js
          grep -q 'Content-Security-Policy' reelscribe/index.html
          grep -q 'rel="canonical"' reelscribe/index.html
          grep -q 'share_target' reelscribe/manifest.webmanifest
          grep -q '@media (max-width: 680px)' reelscribe/styles.css
          grep -q 'prefers-reduced-motion' reelscribe/styles.css
          grep -q 'min-height: 46px' reelscribe/styles.css
          grep -q 'html.model-loading' reelscribe/runtime.css
          grep -q '.ocr-tools' reelscribe/runtime.css
          ! grep -q 'class="notes shell"' reelscribe/index.html

      - name: Audit workflow and client security controls
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/reelscribe-check.yml').read_text(encoding='utf-8')
          uses = re.findall(r'^\s*uses:\s*([^\s#]+)', workflow, flags=re.M)
          for value in uses:
              if value.startswith('./'):
                  continue
              assert re.search(r'@[0-9a-f]{40}$', value), f'Action is not pinned to a full SHA: {value}'

          assert re.search(r'^permissions:\s*\n\s+contents:\s+read\s*$', workflow, flags=re.M)
          index = Path('reelscribe/index.html').read_text(encoding='utf-8')
          assert 'Content-Security-Policy' in index
          assert 'name="referrer" content="no-referrer"' in index

          source = '\n'.join(path.read_text(encoding='utf-8') for path in Path('reelscribe').glob('*.js'))
          assert 'document.cookie' not in source
          assert 'new Function(' not in source
          assert not re.search(r'(^|[^\w])eval\s*\(', source)
          assert 'FormData(' not in Path('reelscribe/screen-ocr.js').read_text(encoding='utf-8')
          PY

      - name: Check Instagram resolver service
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            https://vite-xi-one-59.vercel.app/api/health \
            | tee /tmp/instagram-health.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/instagram-health.json', encoding='utf-8'))
          assert data.get('ok') is True
          assert data.get('mode') == 'public-only-no-cookies-no-storage'
          PY

      - name: Check free model, OCR and provider health
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          for model in whisper-tiny whisper-base whisper-small whisper-large-v3-turbo; do
            curl --fail --silent --show-error --location --retry 3 --max-time 30 \
              "https://huggingface.co/onnx-community/${model}/resolve/main/config.json" \
              | python -m json.tool >/dev/null
          done
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.30/dist/silero_vad_v5.onnx \
            -o /tmp/silero-vad-v5.onnx
          test -s /tmp/silero-vad-v5.onnx
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js \
            -o /tmp/tesseract.min.js
          test -s /tmp/tesseract.min.js
          curl --fail --silent --show-error --location --retry 3 --max-time 20 \
            https://noembed.com/providers >/tmp/noembed-providers.json
          python -m json.tool /tmp/noembed-providers.json >/dev/null
          curl --fail --silent --show-error --location --retry 3 --max-time 20 \
            'https://api.invidious.io/instances.json?sort_by=health' >/tmp/invidious-instances.json
          python -m json.tool /tmp/invidious-instances.json >/dev/null
          curl --fail --silent --show-error --location --retry 3 --max-time 20 \
            https://raw.githubusercontent.com/wiki/TeamPiped/Piped/Instances.md \
            | grep -Eiq 'piped|api'

      - name: Verify production deployment matches repository
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          files=(
            index.html app.js ui.js styles.css ui-polish.css runtime.css
            format-compat.js speech-enhancer.js runtime-optimizer.js screen-ocr.js
            instagram-direct.js worker.js universal-link.js sw.js supported-platforms.html
          )
          for attempt in {1..18}; do
            all_match=true
            for file in "${files[@]}"; do
              remote="/tmp/remote-${file//\//-}"
              if ! curl --fail --silent --show-error --location --max-time 25 \
                "https://paq6809.github.io/reelscribe/${file}?revision=${GITHUB_SHA}" -o "$remote"; then
                all_match=false
                break
              fi
              if ! cmp -s "reelscribe/$file" "$remote"; then
                all_match=false
                break
              fi
            done
            if [ "$all_match" = true ]; then
              echo "Production files match this repository revision."
              exit 0
            fi
            echo "GitHub Pages has not finished deploying; retrying in 20 seconds ($attempt/18)."
            sleep 20
          done
          echo "Production deployment did not match repository files within the verification window." >&2
          exit 1

      - name: Submit updated URLs through IndexNow
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          key="023a07a03f89a9a325ac29506c5f91e19fda61e84ca32ed0c7d6299901a07ca1"
          key_url="https://paq6809.github.io/${key}.txt"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 "$key_url" | grep -qx "$key"
          cat >/tmp/indexnow.json <<JSON
          {
            "host": "paq6809.github.io",
            "key": "$key",
            "keyLocation": "$key_url",
            "urlList": [
              "https://paq6809.github.io/reelscribe/",
              "https://paq6809.github.io/reelscribe/supported-platforms.html",
              "https://paq6809.github.io/reelscribe/sitemap.xml"
            ]
          }
          JSON
          curl --fail --silent --show-error --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            https://api.indexnow.org/indexnow
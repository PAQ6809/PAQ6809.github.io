name: EduCraft CodeQL

on:
  push:
    branches:
      - main
    paths:
      - "educraft/**"
      - ".github/workflows/educraft-codeql.yml"
  pull_request:
    paths:
      - "educraft/**"
      - ".github/workflows/educraft-codeql.yml"
  schedule:
    - cron: "30 19 * * 0"
  workflow_dispatch:

concurrency:
  group: educraft-codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: JavaScript / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@bb16b9baa2ec4010b29f5c606d57d01190139edd # v4.37.1
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@bb16b9baa2ec4010b29f5c606d57d01190139edd # v4.37.1
        with:
          category: /language:javascript-typescript

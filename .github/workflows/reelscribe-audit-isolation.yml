name: ReelScribe audit isolation

on:
  pull_request:
    paths:
      - "reelscribe/**"
      - "tests/reelscribe-*.mjs"
      - ".github/workflows/reelscribe-audit-isolation.yml"

permissions:
  contents: read

jobs:
  audits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run core audit
        run: node tests/reelscribe-audit.mjs

      - name: Run stability audit
        run: node tests/reelscribe-stability-audit.mjs

      - name: Run YouTube quality audit
        run: node tests/reelscribe-youtube-quality-audit.mjs

      - name: Run OCR quality audit
        run: node tests/reelscribe-ocr-quality-audit.mjs

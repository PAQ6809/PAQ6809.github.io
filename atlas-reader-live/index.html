<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5,user-scalable=yes">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="跨圖書資源庫搜尋與專業閱讀平台">
<title>Atlas Reader</title>
<style>
:root{--bg:#f4f7fb;--surface:#fff;--ink:#101828;--muted:#667085;--line:#dfe5ee;--blue:#245eea;--blue2:#1749c7;--ok:#087443;--bad:#b42318;--shadow:0 18px 50px rgba(16,24,40,.09)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));background:rgba(255,255,255,.93);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);font-weight:800;font-size:18px}.brand b{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--blue);color:#fff}.btn{border:1px solid #cdd5df;background:#fff;color:var(--ink);border-radius:11px;padding:10px 14px;font-weight:700}.btn:disabled{opacity:.55}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.hero{max-width:1180px;margin:auto;padding:64px 22px 32px}.ey{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--blue)}.hero h1{font-size:clamp(38px,7vw,72px);line-height:1.03;letter-spacing:-.045em;max-width:900px;margin:16px 0}.hero p{max-width:840px;color:var(--muted);font-size:18px;line-height:1.75}.wrap{max-width:1180px;margin:auto;padding:0 22px 80px}.search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.search input,.dialog input{width:100%;border:1px solid #cdd5df;border-radius:11px;padding:13px 14px;background:#fff;color:var(--ink);outline:none}.status{margin:12px 2px 20px;color:var(--muted);min-height:24px}.status.ok{color:var(--ok)}.status.err{color:var(--bad)}.grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 26px rgba(16,24,40,.05)}.sources{align-self:start;position:sticky;top:82px}.src{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:11px;padding:11px 12px;color:var(--ink);font-weight:750}.src small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.src.on{background:#edf3ff;color:#1749c7}.demos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}.demo{border:1px solid var(--line);background:#fff;border-radius:13px;text-align:left;padding:14px}.demo b{display:block;margin-bottom:5px}.demo span{font-size:13px;color:var(--muted)}.empty{padding:44px 20px;text-align:center;color:var(--muted);border:1px dashed #cdd5df;border-radius:13px}.result{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px;text-decoration:none;color:inherit;border-top:1px solid #eef1f5}.result:hover{background:#f8faff}.cover{display:grid;place-items:center;width:68px;height:92px;border-radius:8px;background:#e8edf5;color:#475467;font-size:12px;font-weight:900;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.result h3{margin:2px 0 6px;font-size:18px}.result p{margin:0 0 8px;color:var(--muted);line-height:1.55}.meta{font-size:13px;color:#475467}.score{font-size:12px;font-weight:900;color:var(--blue);background:#edf3ff;border-radius:999px;padding:6px 8px}.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;background:rgba(15,23,42,.64)}.dialog{width:min(640px,100%);background:#fff;border-radius:18px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.28)}.dialog h2{margin:0 0 14px}.box{white-space:pre-wrap;margin:12px 0 16px;padding:14px;border-radius:12px;background:#f4f7fb;color:#475467;line-height:1.6;min-height:86px}.check{display:flex;gap:9px;align-items:flex-start;margin:12px 0;color:#475467;line-height:1.45}.novel{min-height:100vh;background:#f4ecd9;color:#342e25}.novel article{max-width:740px;margin:auto;padding:54px 24px 120px;font-family:Georgia,"Noto Serif TC",serif}.novel article h1{font-size:clamp(34px,7vw,58px);line-height:1.16}.novel article p{font-size:21px;line-height:1.9}.videoShell{min-height:100vh;background:#0f131b;color:#eef2ff}.videoBody{max-width:1100px;margin:auto;padding:24px}.video{width:100%;max-height:72vh;background:#000;border-radius:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0}.fatal{max-width:760px;margin:70px auto;padding:24px}html.reader-active,body.reader-active{height:100%;overflow:hidden;background:#000;overscroll-behavior:none}.comic-reader{position:fixed;inset:0;z-index:500;background:#000;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;overscroll-behavior-x:none;touch-action:pan-y pinch-zoom;scroll-behavior:smooth}.comic-top{position:fixed;top:0;left:0;right:0;z-index:520;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:linear-gradient(#000d,transparent);color:#fff;transition:opacity .2s}.comic-top.hidden{opacity:0;pointer-events:none}.comic-pages{width:100%;max-width:1200px;margin:0 auto;background:#000}.comic-page{width:100%;min-height:100svh;display:grid;place-items:center;background:#000;scroll-snap-align:start;overflow:hidden}.comic-page svg,.comic-page img{display:block;width:100%;max-width:100%;height:auto;min-height:100svh;object-fit:contain;object-position:center;margin:0 auto;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;transform:none}.comic-count{font-variant-numeric:tabular-nums;background:#0009;border:1px solid #ffffff33;border-radius:999px;padding:7px 10px}.comic-exit{border:1px solid #ffffff44;background:#0009;color:#fff;border-radius:999px;padding:8px 12px}.comic-hint{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:520;background:#000b;color:#fff;border-radius:999px;padding:8px 12px;font-size:12px;pointer-events:none;transition:opacity .5s}.comic-hint.hide{opacity:0}@media(max-width:780px){.hero{padding-top:42px}.grid{grid-template-columns:1fr}.sources{position:static;display:flex;overflow-x:auto;gap:6px}.src{min-width:150px}.demos{grid-template-columns:1fr}.result{grid-template-columns:56px minmax(0,1fr)}.cover{width:56px;height:76px}.score{display:none}}@media(max-width:520px){.hero{padding:38px 16px 22px}.hero h1{font-size:43px}.hero p{font-size:16px}.wrap{padding:0 16px 70px}.search{grid-template-columns:1fr}.search .btn{width:100%}.panel{padding:12px}.dialog{padding:18px}.result{padding:12px 4px}.result h3{font-size:16px}.comic-pages{max-width:100vw}.comic-page svg,.comic-page img{width:100vw;max-width:100vw}}
</style>
</head>
<body>
<div id="app"><main class="fatal"><small>ATLAS READER</small><h1>正在啟動搜尋與閱讀工作區</h1><p>主程式正在初始化。</p></main></div>
<script>
(function(){'use strict';var API='https://goedzzhhvvnfczgnkqlv.supabase.co/functions/v1/atlas-library-api';var app=document.getElementById('app');var state={q:'',source:'all',results:[]};var sources=[['all','全部資源庫','聯合搜尋'],['31000000-0000-0000-0000-000000000001','Open Library','即時 API'],['31000000-0000-0000-0000-000000000002','Project Gutenberg','Gutendex'],['31000000-0000-0000-0000-000000000003','中文維基文庫','MediaWiki'],['31000000-0000-0000-0000-000000000004','Internet Archive','全文與掃描'],['31000000-0000-0000-0000-000000000005','Google Books','預覽與書目']];function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function safeUrl(v){try{var u=new URL(String(v));return /https?:/.test(u.protocol)?u.href:'#'}catch(_){return '#'}}function header(){return '<header class="top"><button class="brand" type="button" data-go="home"><b>A</b>Atlas Reader</button><button class="btn" type="button" data-go="import">匯入網址</button></header>'}function renderHome(){document.documentElement.classList.remove('reader-active');document.body.classList.remove('reader-active');app.innerHTML=header()+'<section class="hero"><span class="ey">FEDERATED SEARCH + PROFESSIONAL READERS</span><h1>搜尋公開圖書資源，使用專業閱讀器。</h1><p>目前保留合法公開圖書來源。Telegram 僅支援你擁有、管理或取得索引授權的頻道／匯出檔，不會代登入、抓取或重播第三方受限漫畫內容。</p></section><main class="wrap"><section class="search"><input id="q" autocomplete="off" value="'+esc(state.q)+'" placeholder="輸入書名、作者或關鍵字"><button id="search" class="btn primary" type="button">搜尋</button></section><div id="status" class="status">輸入至少 2 個字元後搜尋。</div><div class="grid"><aside class="panel sources">'+sources.map(function(s){return '<button class="src '+(state.source===s[0]?'on':'')+'" type="button" data-src="'+s[0]+'">'+esc(s[1])+'<small>'+esc(s[2])+'</small></button>'}).join('')+'</aside><section class="panel"><div class="demos"><button class="demo" type="button" data-demo="comic"><b>全螢幕漫畫閱讀器</b><span>直向滾動、鎖定水平位移、滿版顯示</span></button><button class="demo" type="button" data-demo="novel"><b>小說閱讀器</b><span>單欄、字級與長文排版</span></button><button class="demo" type="button" data-demo="video"><b>影片播放器</b><span>手機內嵌播放與倍速</span></button></div><div id="results">'+renderResults()+'</div></section></div></main>';document.getElementById('search').onclick=runSearch;document.getElementById('q').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();runSearch()}}}function renderResults(){if(!state.results.length)return '<div class="empty">尚未搜尋。搜尋後會顯示來源、存取狀態與原始入口。</div>';return state.results.map(function(r){var cover=r.coverUrl?'<img src="'+esc(safeUrl(r.coverUrl))+'" alt="" loading="lazy">':esc((r.kind||'BOOK').slice(0,4));return '<a class="result" href="'+esc(safeUrl(r.externalUrl))+'" target="_blank" rel="noopener noreferrer"><span class="cover">'+cover+'</span><div><h3>'+esc(r.title||'未命名資料')+'</h3><p>'+esc(r.snippet||'沒有摘要')+'</p><div class="meta">'+esc(r.sourceName||'圖書資源庫')+' · '+esc(r.permission||'依來源標示')+'</div></div><span class="score">'+Math.round((Number(r.score)||.5)*100)+'</span></a>'}).join('')}function setStatus(t,k){var el=document.getElementById('status');if(el){el.className='status'+(k?' '+k:'');el.textContent=t}}async function runSearch(){var q=document.getElementById('q'),btn=document.getElementById('search');if(!q||!btn)return;var query=q.value.trim();state.q=query;if(query.length<2){setStatus('請至少輸入 2 個字元。','err');return}btn.disabled=true;btn.textContent='搜尋中…';setStatus('正在查詢多個圖書資源庫…','');try{var r=await fetch(API+'?action=search&q='+encodeURIComponent(query)+'&source='+encodeURIComponent(state.source),{cache:'no-store',headers:{accept:'application/json'}});var d=await r.json();if(!r.ok)throw Error(d.error||('HTTP '+r.status));state.results=Array.isArray(d.results)?d.results:[];renderHome();setStatus('完成：'+state.results.length+' 筆；'+(d.providersOk||0)+' 個來源成功。','ok')}catch(e){btn.disabled=false;btn.textContent='搜尋';setStatus('搜尋失敗：'+e.message,'err')}}function openImport(){document.body.insertAdjacentHTML('beforeend','<div class="modal" id="modal"><section class="dialog"><h2>匯入網址或授權頻道</h2><input id="url" type="url" inputmode="url" placeholder="https://example.com/book.epub"><label class="check"><input id="authorized" type="checkbox"><span>我擁有此來源、是頻道管理員，或已取得索引與閱讀授權。</span></label><div class="box" id="ibox">一般公開檔案會執行安全網址解析。Telegram 頻道只接受已授權來源；不會代登入、轉送 Cookie 或抓取第三方漫畫檔。</div><button class="btn primary" type="button" id="parse">開始解析</button> <button class="btn" type="button" id="close">關閉</button></section></div>');document.getElementById('close').onclick=function(){document.getElementById('modal').remove()};document.getElementById('parse').onclick=parseUrl}async function parseUrl(){var input=document.getElementById('url'),box=document.getElementById('ibox'),btn=document.getElementById('parse'),auth=document.getElementById('authorized');var raw=input.value.trim();if(!raw){box.textContent='請先輸入網址。';return}var u;try{u=new URL(raw)}catch(_){box.textContent='網址格式不正確。';return}if((u.hostname==='t.me'||u.hostname.endsWith('.telegram.me'))&&!auth.checked){box.textContent='Telegram 來源需要先確認你擁有或已取得索引授權。';return}if(u.hostname==='t.me'||u.hostname.endsWith('.telegram.me')){box.textContent='已辨識授權 Telegram 來源。下一步需使用頻道管理員提供的匯出檔或 Bot/API 權限建立索引；本站不會公開抓取第三方頻道媒體。';return}btn.disabled=true;btn.textContent='解析中…';box.textContent='正在執行安全檢查…';try{var r=await fetch(API+'?action=import',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:raw})});var d=await r.json();box.textContent=(d.ok?'解析成功':'需要處理')+'\n類型：'+(d.sourceType||d.code||'unknown')+'\n閱讀器：'+(d.viewerType||'尚未決定')+'\n'+(d.message||'')}catch(e){box.textContent='解析失敗：'+e.message}finally{btn.disabled=false;btn.textContent='開始解析'}}function comicSvg(i){var colors=['#f4eadb','#e4eefb','#f8e5eb','#e9f5e8','#eee8fa'];var c=colors[(i-1)%colors.length];return '<svg viewBox="0 0 900 1350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="漫畫示範第 '+i+' 頁"><rect width="900" height="1350" fill="'+c+'"/><rect x="55" y="55" width="790" height="1240" rx="22" fill="#fff" stroke="#111827" stroke-width="8"/><circle cx="450" cy="390" r="210" fill="#111827" opacity=".12"/><path d="M250 590 Q450 230 650 590" fill="none" stroke="#111827" stroke-width="26"/><rect x="135" y="790" width="630" height="270" rx="40" fill="#fff" stroke="#111827" stroke-width="7"/><text x="450" y="900" text-anchor="middle" font-size="64" font-family="sans-serif" font-weight="800" fill="#111827">Atlas Reader</text><text x="450" y="990" text-anchor="middle" font-size="48" font-family="sans-serif" fill="#111827">直向滿版閱讀 · '+i+'</text></svg>'}function openComic(){document.documentElement.classList.add('reader-active');document.body.classList.add('reader-active');var pages='';for(var i=1;i<=5;i++)pages+='<section class="comic-page" data-page="'+i+'">'+comicSvg(i)+'</section>';app.innerHTML='<main class="comic-reader" id="comicReader"><header class="comic-top" id="comicTop"><button class="comic-exit" type="button" data-go="home">✕ 離開</button><span class="comic-count" id="comicCount">1 / 5</span><button class="comic-exit" type="button" id="toggleUi">隱藏工具</button></header><div class="comic-pages">'+pages+'</div><div class="comic-hint" id="comicHint">上下滑動閱讀；畫面已鎖定水平位移</div></main>';var reader=document.getElementById('comicReader'),top=document.getElementById('comicTop'),hint=document.getElementById('comicHint');setTimeout(function(){hint&&hint.classList.add('hide')},2200);document.getElementById('toggleUi').onclick=function(){top.classList.toggle('hidden')};reader.addEventListener('click',function(e){if(e.target===reader)top.classList.toggle('hidden')});var observer=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting&&entry.intersectionRatio>.55){document.getElementById('comicCount').textContent=entry.target.dataset.page+' / 5'}})},{root:reader,threshold:[.55]});document.querySelectorAll('.comic-page').forEach(function(p){observer.observe(p)});if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(function(){})}function openNovel(){app.innerHTML='<main class="novel">'+header()+'<article><span class="ey">NOVEL READER</span><h1>閱讀方式應該跟著內容走</h1><p>小說需要可重排字體、行距、章節與閱讀主題。手機版採單欄，避免左右漂移。</p><p>合法匯入的 EPUB、TXT 或 HTML 會在此載入。</p></article></main>'}function openVideo(){app.innerHTML='<main class="videoShell">'+header()+'<div class="videoBody"><video class="video" controls playsinline preload="metadata"></video><div class="toolbar"><button class="btn" type="button" id="speed">1.5×</button></div><p>合法匯入的影片會在此載入字幕、章節與播放進度。</p></div></main>';document.getElementById('speed').onclick=function(){document.querySelector('video').playbackRate=1.5}}document.addEventListener('click',function(e){var el=e.target.closest&&e.target.closest('[data-go],[data-src],[data-demo]');if(!el)return;if(el.dataset.go==='home'){if(document.fullscreenElement)document.exitFullscreen().catch(function(){});renderHome()}else if(el.dataset.go==='import')openImport();else if(el.dataset.src){state.source=el.dataset.src;renderHome();if(state.q.length>=2)runSearch()}else if(el.dataset.demo==='comic')openComic();else if(el.dataset.demo==='novel')openNovel();else if(el.dataset.demo==='video')openVideo()});window.addEventListener('error',function(e){app.innerHTML='<main class="fatal"><span class="ey">SAFE RECOVERY</span><h1>前端程式發生錯誤</h1><p>'+esc(e.message||'未知錯誤')+'</p><button class="btn primary" onclick="location.reload()">重新整理</button></main>'});renderHome()})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="跨圖書資源庫搜尋與專業閱讀平台">
<title>Atlas Reader</title>
<style>
:root{color-scheme:light;--bg:#f4f7fb;--surface:#fff;--ink:#101828;--muted:#667085;--line:#dfe5ee;--blue:#245eea;--blue2:#1749c7;--ok:#087443;--bad:#b42318;--shadow:0 18px 50px rgba(16,24,40,.09)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);font-weight:800;font-size:18px}.brand b{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--blue);color:#fff}.btn{border:1px solid #cdd5df;background:#fff;color:var(--ink);border-radius:11px;padding:10px 14px;font-weight:700}.btn:hover{border-color:#98a2b3}.btn:disabled{opacity:.55;cursor:wait}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue2)}.hero{max-width:1180px;margin:auto;padding:70px 22px 36px}.ey{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--blue)}.hero h1{font-size:clamp(36px,7vw,72px);line-height:1.02;letter-spacing:-.045em;max-width:900px;margin:16px 0}.hero p{max-width:830px;color:var(--muted);font-size:18px;line-height:1.75}.wrap{max-width:1180px;margin:auto;padding:0 22px 80px}.search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.search input,.dialog input{width:100%;border:1px solid #cdd5df;border-radius:11px;padding:13px 14px;background:#fff;color:var(--ink);outline:none}.search input:focus,.dialog input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(36,94,234,.13)}.status{margin:12px 2px 20px;color:var(--muted);min-height:24px}.status.ok{color:var(--ok)}.status.err{color:var(--bad)}.grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 26px rgba(16,24,40,.05)}.sources{align-self:start;position:sticky;top:80px}.src{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:11px;padding:11px 12px;color:var(--ink);font-weight:750}.src small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.src.on{background:#edf3ff;color:#1749c7}.demos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}.demo{border:1px solid var(--line);background:#fff;border-radius:13px;text-align:left;padding:14px}.demo b{display:block;margin-bottom:5px}.demo span{font-size:13px;color:var(--muted)}.empty{padding:44px 20px;text-align:center;color:var(--muted);border:1px dashed #cdd5df;border-radius:13px}.result{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px;text-decoration:none;color:inherit;border-top:1px solid #eef1f5}.result:first-child{border-top:0}.result:hover{background:#f8faff}.cover{display:grid;place-items:center;width:68px;height:92px;border-radius:8px;background:#e8edf5;color:#475467;font-size:12px;font-weight:900;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.result h3{margin:2px 0 6px;font-size:18px}.result p{margin:0 0 8px;color:var(--muted);line-height:1.55}.meta{font-size:13px;color:#475467}.score{font-size:12px;font-weight:900;color:var(--blue);background:#edf3ff;border-radius:999px;padding:6px 8px}.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;background:rgba(15,23,42,.6)}.dialog{width:min(640px,100%);background:#fff;border-radius:18px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.28)}.dialog h2{margin:0 0 14px}.box{white-space:pre-wrap;margin:12px 0 16px;padding:14px;border-radius:12px;background:#f4f7fb;color:#475467;line-height:1.6;min-height:86px}.reader{min-height:100vh;background:#0f131b;color:#eef2ff}.reader .top{background:rgba(17,24,39,.92);border-color:#2a3445}.reader .brand,.reader .btn{color:#fff}.reader .btn{background:#202938;border-color:#374151}.rbody{max-width:1100px;margin:auto;padding:24px}.comicPage{height:min(72vh,760px);display:grid;place-items:center;text-align:center;border-radius:16px;background:linear-gradient(135deg,#f5eee4,#fff);color:#1f2937;box-shadow:0 24px 70px #0007}.comicPage h2{font-size:clamp(42px,10vw,100px);margin:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0}.novel{min-height:100vh;background:#f4ecd9;color:#342e25}.novel .top{background:rgba(244,236,217,.94)}.novel article{max-width:740px;margin:auto;padding:54px 24px 120px;font-family:Georgia,"Noto Serif TC",serif}.novel article h1{font-size:clamp(34px,7vw,58px);line-height:1.16}.novel article p{font-size:21px;line-height:1.9}.video{width:100%;max-height:72vh;background:#000;border-radius:14px}.fatal{max-width:760px;margin:70px auto;padding:24px}.fatal pre{white-space:pre-wrap;background:#fff3f2;padding:14px;border-radius:12px;color:var(--bad)}@media(max-width:780px){.hero{padding-top:46px}.grid{grid-template-columns:1fr}.sources{position:static;display:flex;overflow-x:auto;gap:6px}.src{min-width:150px}.demos{grid-template-columns:1fr}.result{grid-template-columns:56px minmax(0,1fr)}.cover{width:56px;height:76px}.score{display:none}}@media(max-width:520px){.top{padding-top:max(12px,env(safe-area-inset-top))}.hero{padding:40px 16px 24px}.hero h1{font-size:43px}.hero p{font-size:16px}.wrap{padding:0 16px 70px}.search{grid-template-columns:1fr}.search .btn{width:100%}.panel{padding:12px}.dialog{padding:18px}.result{padding:12px 4px}.result h3{font-size:16px}}
</style>
</head>
<body>
<div id="app"><main class="fatal"><small>ATLAS READER</small><h1>正在啟動搜尋與閱讀工作區</h1><p>主程式正在初始化。</p></main></div>
<script>
(function(){
'use strict';
var API='https://goedzzhhvvnfczgnkqlv.supabase.co/functions/v1/atlas-library-api';
var app=document.getElementById('app');
var state={q:'',source:'all',results:[],comicPage:1};
var sources=[['all','全部資源庫','聯合搜尋'],['31000000-0000-0000-0000-000000000001','Open Library','即時 API'],['31000000-0000-0000-0000-000000000002','Project Gutenberg','Gutendex'],['31000000-0000-0000-0000-000000000003','中文維基文庫','MediaWiki'],['31000000-0000-0000-0000-000000000004','Internet Archive','全文與掃描'],['31000000-0000-0000-0000-000000000005','Google Books','預覽與書目'],['31000000-0000-0000-0000-000000000006','Standard Ebooks','精製公版書'],['31000000-0000-0000-0000-000000000007','DOAB','開放學術書籍'],['31000000-0000-0000-0000-000000000008','HathiTrust','Public Full View']];
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
function href(value){try{var u=new URL(String(value));return u.protocol==='http:'||u.protocol==='https:'?u.href:'#';}catch(_){return '#';}}
function header(){return '<header class="top"><button class="brand" type="button" data-go="home"><b>A</b>Atlas Reader</button><button class="btn" type="button" data-go="import">匯入網址</button></header>';}
function renderHome(){app.innerHTML=header()+'<section class="hero"><span class="ey">FEDERATED SEARCH + PROFESSIONAL READERS</span><h1>一次搜尋各大開放圖書資源庫。</h1><p>預設整合 Open Library、Project Gutenberg、中文維基文庫、Internet Archive、Google Books、Standard Ebooks、DOAB 與 HathiTrust。保留來源、權利與借閱限制，不繞過登入、DRM 或付費牆。</p></section><main class="wrap"><section class="search"><input id="q" autocomplete="off" value="'+esc(state.q)+'" placeholder="輸入書名、作者或關鍵字"><button id="search" class="btn primary" type="button">搜尋</button></section><div id="status" class="status">輸入至少 2 個字元後搜尋。</div><div class="grid"><aside class="panel sources">'+sources.map(function(s){return '<button class="src '+(state.source===s[0]?'on':'')+'" type="button" data-src="'+s[0]+'">'+esc(s[1])+'<small>'+esc(s[2])+'</small></button>';}).join('')+'</aside><section class="panel"><div class="demos"><button class="demo" type="button" data-demo="comic"><b>漫畫閱讀器</b><span>單頁、翻頁、縮放</span></button><button class="demo" type="button" data-demo="novel"><b>小說閱讀器</b><span>章節、字級、主題</span></button><button class="demo" type="button" data-demo="video"><b>影片播放器</b><span>倍速、PiP、章節</span></button></div><div id="results">'+renderResults()+'</div></section></div></main>';var q=document.getElementById('q');var b=document.getElementById('search');b.addEventListener('click',runSearch);q.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();runSearch();}});}
function renderResults(){if(!state.results.length)return '<div class="empty">尚未搜尋。搜尋後會顯示來源、可用權限與原始入口。</div>';return state.results.map(function(r){var cover=r.coverUrl?'<img src="'+esc(href(r.coverUrl))+'" alt="" loading="lazy">':esc((r.kind||'BOOK').slice(0,4));return '<a class="result" href="'+esc(href(r.externalUrl))+'" target="_blank" rel="noopener noreferrer"><span class="cover">'+cover+'</span><div><h3>'+esc(r.title||'未命名資料')+'</h3><p>'+esc(r.snippet||'沒有摘要')+'</p><div class="meta">'+esc(r.sourceName||'圖書資源庫')+' · '+esc(r.permission||'依來源標示')+'</div></div><span class="score">'+Math.round((Number(r.score)||.5)*100)+'</span></a>';}).join('');}
function setStatus(text,kind){var s=document.getElementById('status');if(!s)return;s.className='status'+(kind?' '+kind:'');s.textContent=text;}
function runSearch(){var qEl=document.getElementById('q'),btn=document.getElementById('search');if(!qEl||!btn)return;var query=qEl.value.trim();state.q=query;if(query.length<2){setStatus('請至少輸入 2 個字元。','err');return;}btn.disabled=true;btn.textContent='搜尋中…';setStatus('正在查詢多個圖書資源庫…','');fetch(API+'?action=search&q='+encodeURIComponent(query)+'&source='+encodeURIComponent(state.source),{method:'GET',cache:'no-store',headers:{accept:'application/json'}}).then(function(response){return response.text().then(function(text){var data;try{data=JSON.parse(text);}catch(_){data={error:'回應不是有效 JSON'};}if(!response.ok)throw new Error(data.error||('HTTP '+response.status));return data;});}).then(function(data){state.results=Array.isArray(data.results)?data.results:[];renderHome();setStatus('完成：'+state.results.length+' 筆；'+(data.providersOk||0)+' 個即時來源成功。','ok');}).catch(function(error){btn.disabled=false;btn.textContent='搜尋';setStatus('搜尋失敗：'+error.message,'err');});}
function openImport(){if(document.getElementById('modal'))return;document.body.insertAdjacentHTML('beforeend','<div class="modal" id="modal"><section class="dialog" role="dialog" aria-modal="true"><h2>匯入網址</h2><input id="url" type="url" inputmode="url" placeholder="https://example.com/book.epub"><div class="box" id="ibox">會檢查協定、DNS、私人 IP、重新導向、內容類型與檔案大小。</div><button class="btn primary" type="button" id="parse">開始解析</button> <button class="btn" type="button" id="close">關閉</button></section></div>');document.getElementById('close').addEventListener('click',closeImport);document.getElementById('parse').addEventListener('click',parseUrl);setTimeout(function(){document.getElementById('url').focus();},0);}
function closeImport(){var m=document.getElementById('modal');if(m)m.remove();}
function parseUrl(){var input=document.getElementById('url'),box=document.getElementById('ibox'),btn=document.getElementById('parse');if(!input||!box||!btn)return;var url=input.value.trim();if(!url){box.textContent='請先輸入網址。';return;}btn.disabled=true;btn.textContent='解析中…';box.textContent='正在執行安全檢查…';fetch(API+'?action=import',{method:'POST',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify({url:url})}).then(function(response){return response.text().then(function(text){var data;try{data=JSON.parse(text);}catch(_){data={message:'回應不是有效 JSON'};}if(!response.ok&&response.status>=500)throw new Error(data.message||('HTTP '+response.status));return data;});}).then(function(data){box.textContent=(data.ok?'解析成功':'需要處理')+'\n類型：'+(data.sourceType||data.code||'unknown')+'\n閱讀器：'+(data.viewerType||'尚未決定')+'\n'+(data.message||'');}).catch(function(error){box.textContent='解析失敗：'+error.message;}).finally(function(){btn.disabled=false;btn.textContent='開始解析';});}
function renderReader(type){if(type==='novel'){app.innerHTML='<main class="novel">'+header()+'<article><span class="ey">NOVEL READER</span><h1>閱讀方式應該跟著內容走</h1><p>小說需要可重排字體、行距、章節與閱讀主題。Atlas Reader 會保留來源與進度，不把所有內容粗暴地轉成 PDF。</p><p>手機版採單欄閱讀；桌機版可擴充目錄、註解與全文搜尋。</p></article></main>';return;}if(type==='video'){app.innerHTML='<main class="reader">'+header()+'<div class="rbody"><video class="video" controls playsinline preload="metadata"></video><div class="toolbar"><button class="btn" type="button" data-action="speed">1.5×</button><button class="btn" type="button" data-action="pip">PiP</button></div><p>影片來源匯入後會在此載入字幕、章節與播放進度。</p></div></main>';return;}state.comicPage=1;app.innerHTML='<main class="reader">'+header()+'<div class="rbody"><section class="comicPage"><div><span class="ey">COMIC READER</span><h2 id="comicTitle">Atlas Reader</h2><p id="comicMeta">單頁模式 · 第 1 / 4 頁</p></div></section><div class="toolbar"><button class="btn" type="button" data-action="prev">上一頁</button><button class="btn" type="button" data-action="next">下一頁</button><button class="btn" type="button" data-action="zoom">放大</button></div></div></main>';}
function comicMove(delta){state.comicPage=Math.max(1,Math.min(4,state.comicPage+delta));var meta=document.getElementById('comicMeta');var title=document.getElementById('comicTitle');if(meta)meta.textContent='單頁模式 · 第 '+state.comicPage+' / 4 頁';if(title)title.textContent=state.comicPage===1?'Atlas Reader':'Page '+state.comicPage;}
document.addEventListener('click',function(ev){var el=ev.target&&ev.target.closest?ev.target.closest('[data-go],[data-src],[data-demo],[data-action]'):null;if(!el)return;var go=el.getAttribute('data-go'),src=el.getAttribute('data-src'),demo=el.getAttribute('data-demo'),action=el.getAttribute('data-action');if(go==='home')renderHome();else if(go==='import')openImport();else if(src){state.source=src;renderHome();if(state.q.length>=2)runSearch();}else if(demo)renderReader(demo);else if(action==='next')comicMove(1);else if(action==='prev')comicMove(-1);else if(action==='zoom'){var page=document.querySelector('.comicPage');if(page)page.style.transform=page.style.transform?'':'scale(1.04)';}else if(action==='speed'){var v=document.querySelector('video');if(v)v.playbackRate=1.5;}else if(action==='pip'){var v2=document.querySelector('video');if(v2&&v2.requestPictureInPicture)v2.requestPictureInPicture().catch(function(){});}});
window.addEventListener('error',function(ev){app.innerHTML='<main class="fatal"><span class="ey">SAFE RECOVERY</span><h1>前端程式發生錯誤</h1><pre>'+esc(ev.message||'未知錯誤')+'</pre><button class="btn primary" type="button" onclick="location.reload()">重新整理</button></main>';});
renderHome();
})();
</script>
</body>
</html>

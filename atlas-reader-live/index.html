inter-events:none;transition:opacity .5s}.comic-hint.hide{opacity:0}.frame-reader,.video-reader{position:fixed;inset:0;z-index:500;background:#111}.frame-reader iframe{width:100%;height:100%;border:0;padding-top:58px}.video-reader{display:grid;place-items:center;padding:74px 16px 20px}.video-reader video{width:min(1200px,100%);max-height:calc(100svh - 100px);background:#000}.text-reader{position:fixed;inset:0;z-index:500;overflow:auto;background:#f4ecd9;color:#342e25}.text-reader article{max-width:760px;margin:auto;padding:90px 24px 120px;font-family:Georgia,"Noto Serif TC",serif}.text-reader h1{font-size:clamp(34px,7vw,58px)}.text-reader p{font-size:20px;line-height:1.9;white-space:pre-wrap}.reader-bar{position:fixed;top:0;left:0;right:0;z-index:520;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:rgba(15,19,27,.94);color:#fff}.reader-bar button{border:1px solid #ffffff44;background:#202938;color:#fff;border-radius:999px;padding:8px 12px}.fatal{max-width:760px;margin:70px auto;padding:24px}.fatal pre{white-space:pre-wrap;background:#fff3f2;padding:14px;border-radius:12px;color:var(--bad)}

<body>
  <div id="app"><main class="fatal"><small>ATLAS READER</small><h1>正在啟動授權內容模式</h1><p>所有索引與閱讀都在此裝置完成。</p></main></div>
  <script>
    window.__atlasBooted = false;
    window.setTimeout(function () {
      if (window.__atlasBooted) return;
      var target = document.getElementById('app');
      if (target) target.innerHTML = '<main class="fatal"><span class="ey">SAFE RECOVERY</span><h1>Atlas Reader 未能完成啟動</h1><p>請重新整理；若問題持續，維護巡檢會保留這次啟動失敗的可診斷訊息。</p><button class="btn primary" onclick="location.reload()">重新整理</button></main>';
    }, 4000);
  </script>
  <script>
  (function () {
    'use strict';

    var API_BASE = 'https://goedzzhhvvnfczgnkqlv.supabase.co/functions/v1/atlas-library-api';
    var API_KEY = 'sb_publishable_6whjqbImNMa7BR9i-96M-w_dFIOFeMN';
    var app = document.getElementById('app');
    var objectUrls = [];
    var state = {
      query: '',
      items: [],
      results: [],
      apiStatus: 'checking',
      apiMessage: '正在檢查解析服務…'
    };

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
      });
    }

    function makeObjectUrl(file) {
      var url = URL.createObjectURL(file);
      objectUrls.push(url);
      return url;
    }

    function cleanupObjectUrls() {
      objectUrls.forEach(function (url) {
        try { URL.revokeObjectURL(url); } catch (_) {}
      });
      objectUrls = [];
    }

    function demoComicPages() {
      return ['#f6efe7', '#e9f0f8', '#f7e8eb', '#eef5e8'].map(function (color, index) {
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700"><rect width="100%" height="100%" fill="' + color + '"/><rect x="70" y="70" width="1060" height="1560" rx="24" fill="white" stroke="#202737" stroke-width="10"/><text x="600" y="790" text-anchor="middle" font-family="sans-serif" font-size="86" font-weight="800" fill="#202737">Atlas Reader</text><text x="600" y="930" text-anchor="middle" font-family="sans-serif" font-size="64" fill="#202737">直向滾動 ' + (index + 1) + ' / 4</text></svg>';
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      });
    }

    function buildSamples() {
      return [
        {
          id: 'sample-comic', title: 'Atlas 漫畫閱讀器示範',
          text: '四頁授權示範內容，可測試手機直向滿版閱讀與頁碼追蹤。',
          type: 'comic', source: 'Atlas 內建授權範例', images: demoComicPages(), score: 1
        },
        {
          id: 'sample-novel', title: 'Atlas 小說閱讀器示範',
          text: '這是一段可搜尋、可開啟的長文示範。Atlas Reader 只處理你有權使用的內容，並優先在目前裝置建立索引。\n\n手機版保留舒適行距、可捲動版面與安全返回控制。',
          type: 'text', source: 'Atlas 內建授權範例', images: [], score: 1
        },
        {
          id: 'sample-video', title: 'Atlas 影片閱讀器示範',
          text: 'CC0 測試影片，用來驗證手機與桌面影片閱讀器可以開啟、播放與返回。',
          type: 'video', source: 'MDN CC0 測試媒體',
          url: 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4', images: [], score: 1
        }
      ];
    }

    function loadPersistedUrlItems() {
      try {
        var value = JSON.parse(localStorage.getItem('atlas-reader-url-items-v1') || '[]');
        return Array.isArray(value) ? value.filter(function (item) { return item && item.id && item.url; }).slice(0, 100) : [];
      } catch (_) { return []; }
    }

    function persistUrlItems() {
      try {
        var safe = state.items.filter(function (item) { return item.persist === true && item.url; }).slice(-100);
        localStorage.setItem('atlas-reader-url-items-v1', JSON.stringify(safe));
      } catch (_) {}
    }

    function header() {
      return '<header class="top"><button class="brand" type="button" data-go="home"><b>A</b>Atlas Reader</button><div class="actions"><button class="btn" type="button" data-go="import">匯入檔案／網址</button></div></header>';
    }

    function apiBadge() {
      if (state.apiStatus === 'ok') return '<span class="badge">解析服務正常</span>';
      if (state.apiStatus === 'error') return '<span class="badge warn">解析服務降級</span>';
      return '<span class="badge off">檢查解析服務</span>';
    }

    function home() {
      document.documentElement.classList.remove('reader-active');
      document.body.classList.remove('reader-active');
      app.innerHTML = header() +
        '<section class="hero"><span class="ey">AUTHORIZED CONTENT MODE</span><h1>搜尋、解析並閱讀你有權使用的內容。</h1><p>搜尋會立即回傳內建授權範例與你匯入的資料。檔案在目前裝置解析；網址只回傳安全中繼資料，不代登入、不繞過權限，也不保存第三方內容。</p></section>' +
        '<main class="wrap"><section class="search"><input id="q" autocomplete="off" value="' + esc(state.query) + '" placeholder="搜尋 Atlas、漫畫、小說、影片或已匯入內容"><button id="search" class="btn primary" type="button">搜尋</button></section>' +
        '<div id="status" class="status" aria-live="polite">' + statusText() + '</div>' +
        '<div class="grid"><aside class="panel side">' + apiBadge() + '<h3>來源與閱讀器</h3><p>' + esc(state.apiMessage) + '</p>' +
        '<button class="demo" data-demo="comic"><b>漫畫閱讀器</b><span>手機直向滿版、鎖定水平漂移</span></button>' +
        '<button class="demo" data-demo="text"><b>小說閱讀器</b><span>長文版面與舒適行距</span></button>' +
        '<button class="demo" data-demo="video"><b>影片閱讀器</b><span>原生播放控制與全螢幕支援</span></button></aside>' +
        '<section class="panel"><div id="results">' + renderResults() + '</div></section></div></main>';

      document.getElementById('search').onclick = runSearch;
      document.getElementById('q').onkeydown = function (event) {
        if (event.key === 'Enter') { event.preventDefault(); runSearch(); }
      };
    }

    function statusText() {
      if (state.query) return state.results.length ? '找到 ' + state.results.length + ' 筆相關資料。' : '沒有找到相符資料。';
      return '目前可搜尋 ' + state.items.length + ' 筆資料（含 3 筆內建授權範例）。';
    }

    function renderResults() {
      var list = state.query ? state.results : state.items;
      if (!list.length) return '<div class="empty">尚無可顯示資料。請匯入你有權使用的檔案或網址。</div>';
      return list.map(function (item) {
        var thumb = item.images && item.images[0] ? '<img src="' + esc(item.images[0]) + '" alt="">' : esc(String(item.type || 'FILE').slice(0, 5).toUpperCase());
        return '<button class="result" type="button" data-open="' + esc(item.id) + '"><span class="thumb">' + thumb + '</span><div><h3>' + esc(item.title) + '</h3><p>' + esc(item.text || '沒有文字摘要') + '</p><div class="meta">' + esc(item.source || '授權來源') + ' · ' + esc(item.type) + '</div></div><span class="score">' + Math.round((item.score || 1) * 100) + '</span></button>';
      }).join('');
    }

    function normalize(value) {
      return String(value || '').toLocaleLowerCase('zh-Hant').normalize('NFKC');
    }

    function tokens(value) {
      return normalize(value).replace(/[\p{P}\p{S}\s]+/gu, ' ').trim().split(/\s+/).filter(Boolean);
    }

    function bigrams(value) {
      var text = normalize(value).replace(/\s+/g, '');
      var output = [];
      for (var index = 0; index < text.length - 1; index += 1) output.push(text.slice(index, index + 2));
      return output;
    }

    function searchScore(item, query) {
      var title = normalize(item.title);
      var haystack = normalize((item.title || '') + ' ' + (item.text || '') + ' ' + (item.source || '') + ' ' + (item.type || ''));
      var score = 0;
      tokens(query).forEach(function (term) {
        if (title.indexOf(term) >= 0) score += 6;
        else if (haystack.indexOf(term) >= 0) score += 3;
      });
      bigrams(query).forEach(function (pair) { if (haystack.indexOf(pair) >= 0) score += 1; });
      return score;
    }

    function runSearch() {
      var input = document.getElementById('q');
      var query = input ? input.value.trim() : '';
      state.query = query;
      if (!query) { state.results = []; home(); return; }
      state.results = state.items.map(function (item) {
        return Object.assign({}, item, { score: searchScore(item, query) });
      }).filter(function (item) { return item.score > 0; }).sort(function (a, b) {
        return b.score - a.score || String(a.title).localeCompare(String(b.title), 'zh-Hant');
      });
      home();
      var status = document.getElementById('status');
      if (status) status.className = 'status ' + (state.results.length ? 'ok' : 'err');
    }

    function openImport() {
      if (document.getElementById('modal')) return;
      document.body.insertAdjacentHTML('beforeend',
        '<div class="modal" id="modal"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="import-title"><h2 id="import-title">匯入授權資料</h2>' +
        '<h3>解析網址</h3><div class="row"><input id="importUrl" type="url" inputmode="url" placeholder="https://example.com/document.pdf"><button class="btn primary" id="parseUrl" type="button">解析網址</button></div>' +
        '<p class="meta">只接受 HTTPS 公開網址；不代登入、不攜帶 Cookie、不繞過付費或權限。</p>' +
        '<h3>選擇本機檔案</h3><label class="drop"><b>選擇 JSON、HTML、TXT、PDF、圖片或影片</b><input id="files" type="file" multiple accept=".json,.html,.htm,.txt,.pdf,image/*,video/*"></label>' +
        '<label class="drop"><b>選擇 Telegram Desktop 匯出目錄</b><input id="folder" type="file" multiple webkitdirectory></label>' +
        '<label class="check"><input id="rights" type="checkbox">我確認自己擁有、管理或已取得這些內容的索引與閱讀權限。</label>' +
        '<div class="box" id="ibox">資料會在目前瀏覽器中解析；網址服務只讀取受限大小的中繼資料。</div>' +
        '<button class="btn primary" id="doImport" type="button">匯入檔案</button> <button class="btn" id="close" type="button">關閉</button></section></div>');
      document.getElementById('close').onclick = closeImport;
      document.getElementById('doImport').onclick = importFiles;
      document.getElementById('parseUrl').onclick = importUrl;
      document.getElementById('importUrl').onkeydown = function (event) {
        if (event.key === 'Enter') { event.preventDefault(); importUrl(); }
      };
    }

    function closeImport() {
      var modal = document.getElementById('modal');
      if (modal) modal.remove();
    }

    function flattenTelegramText(value) {
      if (typeof value === 'string') return value;
      if (Array.isArray(value)) return value.map(function (entry) {
        return typeof entry === 'string' ? entry : (entry && entry.text) || '';
      }).join('');
      return '';
    }

    function importTelegramJson(data, fileMap) {
      var output = [];
      (data.messages || []).forEach(function (message) {
        var text = flattenTelegramText(message.text);
        var fileName = message.file || message.photo || message.thumbnail || '';
        var images = [];
        if (fileName && fileMap[fileName] && fileMap[fileName].type.indexOf('image/') === 0) images.push(makeObjectUrl(fileMap[fileName]));
        var firstLine = text.trim().split(/\r?\n/)[0];
        output.push({
          id: 'tg-' + (message.id || crypto.randomUUID()),
          title: firstLine.slice(0, 80) || ('Telegram 貼文 ' + (message.id || '')),
          text: text.slice(0, 20000),
          type: images.length ? 'comic' : 'text',
          source: data.name || 'Telegram 匯出', images: images, score: 1
        });
      });
      return output;
    }

    function importHtml(html, fileName) {
      var documentValue = new DOMParser().parseFromString(html, 'text/html');
      var nodes = documentValue.querySelectorAll('.message,article,.post');
      var output = [];
      nodes.forEach(function (node, index) {
        var text = (node.textContent || '').replace(/\s+/g, ' ').trim();
        if (text) output.push({ id: 'html-' + Date.now() + '-' + index, title: text.slice(0, 80), text: text.slice(0, 20000), type: 'text', source: fileName || 'HTML 匯出', images: [], score: 1 });
      });
      if (!output.length) {
        var bodyText = (documentValue.body && documentValue.body.textContent || '').replace(/\s+/g, ' ').trim();
        if (bodyText) output.push({ id: 'html-' + Date.now(), title: documentValue.title || fileName || 'HTML 文件', text: bodyText.slice(0, 20000), type: 'text', source: fileName || 'HTML 檔案', images: [], score: 1 });
      }
      return output;
    }

    async function importFiles() {
      var box = document.getElementById('ibox');
      var button = document.getElementById('doImport');
      if (!document.getElementById('rights').checked) { box.textContent = '請先確認你擁有或已取得內容使用權限。'; return; }
      var files = Array.from(document.getElementById('files').files || []).concat(Array.from(document.getElementById('folder').files || []));
      if (!files.length) { box.textContent = '請先選擇檔案或目錄。'; return; }
      button.disabled = true;
      box.textContent = '正在建立本機索引…';
      var fileMap = {};
      files.forEach(function (file) { fileMap[file.webkitRelativePath || file.name] = file; fileMap[file.name] = file; });
      var added = [];
      var looseImages = files.filter(function (file) { return file.type.indexOf('image/') === 0; });
      if (looseImages.length) {
        added.push({
          id: 'comic-' + Date.now(), title: '本機漫畫 ' + new Date().toLocaleString(),
          text: looseImages.map(function (file) { return file.name; }).join(' '), type: 'comic', source: '本機圖片',
          images: looseImages.sort(function (a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true }); }).map(makeObjectUrl), score: 1
        });
      }
      for (var index = 0; index < files.length; index += 1) {
        var file = files[index];
        try {
          if (/\.json$/i.test(file.name)) added = added.concat(importTelegramJson(JSON.parse(await file.text()), fileMap));
          else if (/\.html?$/i.test(file.name)) added = added.concat(importHtml(await file.text(), file.name));
          else if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) added.push({ id: 'pdf-' + Date.now() + '-' + index, title: file.name, text: '本機 PDF 文件', type: 'pdf', source: '本機檔案', url: makeObjectUrl(file), images: [], score: 1 });
          else if (file.type.indexOf('video/') === 0) added.push({ id: 'video-' + Date.now() + '-' + index, title: file.name, text: '本機影片', type: 'video', source: '本機檔案', url: makeObjectUrl(file), images: [], score: 1 });
          else if (file.type.indexOf('text/') === 0 || /\.txt$/i.test(file.name)) added.push({ id: 'text-' + Date.now() + '-' + index, title: file.name, text: (await file.text()).slice(0, 20000), type: 'text', source: '本機檔案', images: [], score: 1 });
        } catch (error) { console.warn('Atlas Reader skipped file', file.name, error); }
      }
      state.items = state.items.concat(added);
      state.results = [];
      state.query = '';
      box.textContent = '匯入完成：' + added.length + ' 筆。';
      window.setTimeout(function () { closeImport(); home(); }, 450);
    }

    function mapViewerType(value) {
      return ({ 'comic-reader': 'comic', 'image-reader': 'comic', 'pdf-reader': 'pdf', 'text-reader': 'text', 'video-reader': 'video' })[value] || 'link';
    }

    async function importUrl() {
      var input = document.getElementById('importUrl');
      var button = document.getElementById('parseUrl');
      var box = document.getElementById('ibox');
      var raw = input.value.trim();
      if (!raw) { box.textContent = '請輸入 HTTPS 網址。'; return; }
      button.disabled = true;
      box.textContent = '正在安全解析網址中繼資料…';
      try {
        var response = await fetch(API_BASE + '?action=import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': API_KEY },
          body: JSON.stringify({ url: raw })
        });
        var data = await response.json().catch(function () { return {}; });
        if (!response.ok || !data.ok) throw new Error(data.message || data.code || ('HTTP ' + response.status));
        var item = {
          id: 'url-' + Date.now(), title: data.title || data.fileName || data.url,
          text: data.description || data.preview || ('已解析 ' + (data.contentType || '網址內容')),
          type: mapViewerType(data.viewerType), source: data.hostname || '公開 HTTPS 網址',
          url: data.url, images: data.viewerType === 'image-reader' ? [data.url] : [], score: 1, persist: true,
          contentType: data.contentType || '', importedAt: new Date().toISOString()
        };
        state.items.push(item);
        persistUrlItems();
        state.query = '';
        state.results = [];
        box.textContent = '解析完成：' + item.title + '（' + item.type + '）。';
        window.setTimeout(function () { closeImport(); home(); }, 650);
      } catch (error) {
        box.textContent = '解析失敗：' + (error && error.message ? error.message : '未知錯誤');
      } finally { button.disabled = false; }
    }

    function openItem(id) {
      var item = state.items.find(function (entry) { return entry.id === id; });
      if (!item) return;
      if (item.type === 'comic' || (item.images && item.images.length)) openComic(item);
      else if (item.type === 'pdf') openFrame(item, 'PDF');
      else if (item.type === 'video') openVideo(item);
      else if (item.type === 'text') openText(item);
      else if (item.url) window.open(item.url, '_blank', 'noopener,noreferrer');
    }

    function enterReader() {
      document.documentElement.classList.add('reader-active');
      document.body.classList.add('reader-active');
    }

    function openComic(item) {
      enterReader();
      var images = item.images || [];
      var pages = images.map(function (src, index) { return '<section class="comic-page" data-page="' + (index + 1) + '"><img src="' + esc(src) + '" alt="第 ' + (index + 1) + ' 頁" draggable="false"></section>'; }).join('');
      app.innerHTML = '<main class="comic-reader" id="comicReader"><header class="comic-top" id="comicTop"><button class="comic-exit" data-go="home">完成</button><b>' + esc(item.title || '漫畫') + '</b><span class="comic-count" id="comicCount">1 / ' + images.length + '</span></header><div class="comic-pages">' + pages + '</div><div class="comic-hint" id="comicHint">上下滾動閱讀 · 點一下隱藏工具列</div></main>';
      var reader = document.getElementById('comicReader');
      var top = document.getElementById('comicTop');
      var count = document.getElementById('comicCount');
      var hint = document.getElementById('comicHint');
      var timer;
      reader.addEventListener('click', function (event) { if (event.target.closest('button')) return; top.classList.toggle('hidden'); hint.classList.add('hide'); });
      reader.addEventListener('scroll', function () {
        clearTimeout(timer);
        timer = setTimeout(function () {
          var pageNodes = Array.from(reader.querySelectorAll('.comic-page'));
          var best = 1;
          var minimum = Infinity;
          pageNodes.forEach(function (page, index) {
            var distance = Math.abs(page.getBoundingClientRect().top - reader.getBoundingClientRect().top);
            if (distance < minimum) { minimum = distance; best = index + 1; }
          });
          count.textContent = best + ' / ' + pageNodes.length;
        }, 80);
      }, { passive: true });
      setTimeout(function () { hint.classList.add('hide'); }, 2600);
    }

    function openFrame(item, label) {
      enterReader();
      app.innerHTML = '<main class="frame-reader"><header class="reader-bar"><button data-go="home">完成</button><b>' + esc(item.title) + '</b><span>' + esc(label || '') + '</span></header><iframe src="' + esc(item.url) + '" title="' + esc(item.title) + '" referrerpolicy="no-referrer"></iframe></main>';
    }

    function openVideo(item) {
      enterReader();
      app.innerHTML = '<main class="video-reader"><header class="reader-bar"><button data-go="home">完成</button><b>' + esc(item.title) + '</b><span>VIDEO</span></header><video src="' + esc(item.url) + '" controls playsinline preload="metadata" referrerpolicy="no-referrer"></video></main>';
    }

    function openText(item) {
      enterReader();
      app.innerHTML = '<main class="text-reader"><header class="reader-bar"><button data-go="home">完成</button><b>' + esc(item.title) + '</b><span>TEXT</span></header><article><h1>' + esc(item.title) + '</h1><p>' + esc(item.text || '') + '</p></article></main>';
    }

    async function checkApiHealth() {
      try {
        var controller = new AbortController();
        var timeout = setTimeout(function () { controller.abort(); }, 5000);
        var response = await fetch(API_BASE + '?action=health', { headers: { 'apikey': API_KEY }, signal: controller.signal });
        clearTimeout(timeout);
        var data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || ('HTTP ' + response.status));
        state.apiStatus = 'ok';
        state.apiMessage = '解析服務正常，版本 ' + (data.version || 'unknown') + '；公開圖書來源維持停用。';
      } catch (error) {
        state.apiStatus = 'error';
        state.apiMessage = '解析服務暫時無法使用；本機檔案搜尋與閱讀器仍可正常運作。';
      }
      if (!document.querySelector('.modal') && !document.querySelector('.reader-active')) home();
    }

    document.addEventListener('click', function (event) {
      var element = event.target.closest('[data-go],[data-demo],[data-open]');
      if (!element) return;
      if (element.dataset.go === 'home') home();
      else if (element.dataset.go === 'import') openImport();
      else if (element.dataset.demo === 'comic') openItem('sample-comic');
      else if (element.dataset.demo === 'text') openItem('sample-novel');
      else if (element.dataset.demo === 'video') openItem('sample-video');
      else if (element.dataset.open) openItem(element.dataset.open);
    });

    window.addEventListener('error', function (event) {
      console.error('Atlas Reader fatal error', event.error || event.message);
      app.innerHTML = '<main class="fatal"><span class="ey">SAFE RECOVERY</span><h1>前端程式發生錯誤</h1><pre>' + esc(event.message || '未知錯誤') + '</pre><button class="btn primary" onclick="location.reload()">重新整理</button></main>';
    });
    window.addEventListener('unhandledrejection', function (event) { console.error('Atlas Reader rejected promise', event.reason); });
    window.addEventListener('beforeunload', cleanupObjectUrls);

    try {
      state.items = buildSamples().concat(loadPersistedUrlItems());
      window.__atlasBooted = true;
      home();
      checkApiHealth();
    } catch (error) {
      console.error('Atlas Reader startup failed', error);
      throw error;
    }
  })();
  </script>
</body>
</html>

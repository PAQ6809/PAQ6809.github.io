<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8fb" />
  <title>叫號通 QueueHub｜休息站即時叫號 Demo</title>
  <meta name="description" content="集中查看多家餐廳叫號進度，掃 QR Code 就知道現在叫到幾號。" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <style>
    :root{--bg:#f5f7fb;--panel:#fff;--ink:#131722;--muted:#687386;--line:#e4e8ef;--brand:#2864ff;--brand2:#173b9d;--ok:#16865a;--warn:#ad6700;--danger:#c43f44;--shadow:0 14px 40px rgba(23,36,64,.08);--radius:22px}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;line-height:1.5}
    button,input,select{font:inherit} button{cursor:pointer} a{text-decoration:none;color:inherit}
    .wrap{max-width:1200px;margin:auto;padding:0 20px}.nav{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(228,232,239,.8)}
    .navin{height:68px;display:flex;align-items:center;gap:16px}.brand{font-weight:850;font-size:19px;display:flex;align-items:center;gap:10px}.mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(140deg,var(--brand),#78a2ff);display:grid;place-items:center;color:#fff;font-weight:900}.demo{font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px;background:#fff0cc;color:#855100}.spacer{flex:1}.navlinks{display:flex;gap:6px}.navlinks button{border:0;background:transparent;padding:9px 11px;border-radius:12px;color:var(--muted)}.navlinks button:hover,.navlinks button.active{background:#fff;color:var(--ink);box-shadow:0 2px 12px rgba(20,35,70,.06)}
    main{padding:32px 0 64px}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:24px;align-items:stretch}.heroCard,.panel,.card{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius)}.heroCard{padding:36px}.eyebrow{font-size:13px;font-weight:800;color:var(--brand);letter-spacing:.06em}.hero h1{font-size:clamp(34px,5vw,62px);line-height:1.06;margin:12px 0 16px;letter-spacing:-.04em}.hero p{color:var(--muted);font-size:17px;max-width:680px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.btn{border:1px solid var(--line);background:#fff;padding:11px 15px;border-radius:13px;font-weight:750;color:var(--ink)}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.dark{background:#171b25;color:#fff;border-color:#171b25}.btn.warn{background:#fff5df;border-color:#ffd894;color:#7b4a00}.btn.danger{background:#fff0f0;border-color:#ffcaca;color:#a32c34}.btn:disabled{opacity:.45;cursor:not-allowed}.heroSide{padding:26px;display:flex;flex-direction:column;justify-content:space-between}.sideStat{display:flex;align-items:flex-end;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.sideStat:last-child{border:0}.sideStat b{font-size:30px}.sideStat span{color:var(--muted);font-size:13px}
    .notice{margin:20px 0;background:#eef4ff;border:1px solid #ccdbff;color:#244a9d;padding:12px 15px;border-radius:14px;font-size:13px}.sectionHead{display:flex;gap:12px;align-items:end;margin:32px 0 15px}.sectionHead h2{margin:0;font-size:25px}.sectionHead p{margin:0;color:var(--muted)}.tools{display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:220px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;outline:none}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:999px;color:var(--muted)}.chip.active{background:#171b25;color:#fff;border-color:#171b25}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:20px;transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(23,36,64,.11)}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.restName{font-size:18px;font-weight:850}.tag{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eef3f9;color:#526275}.tag.ok{background:#e8f7f0;color:#14714d}.tag.pause{background:#fff2d9;color:#925c00}.current{font-size:58px;font-weight:900;line-height:1;margin:22px 0 6px;letter-spacing:-.05em}.current small{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0}.recent{display:flex;gap:7px;margin-top:12px}.recent span{background:#f1f3f7;padding:6px 9px;border-radius:9px;font-size:12px;color:#4f5a6b}.meta{font-size:12px;color:var(--muted);margin-top:14px;display:flex;justify-content:space-between}
    .detail{display:grid;grid-template-columns:1fr .8fr;gap:18px}.bigStatus{padding:34px;text-align:center}.bigStatus h1{font-size:22px}.bigNumber{font-size:clamp(92px,17vw,180px);font-weight:950;letter-spacing:-.08em;line-height:.95;margin:28px 0 12px;color:var(--brand2)}.sub{color:var(--muted)}.ticketBox{padding:26px}.ticketBox h2{margin-top:0}.field{display:flex;gap:8px}.field input,.field select,.formgrid input,.formgrid select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;outline:none}.result{margin-top:16px;border-radius:16px;padding:16px;background:#f1f5ff;border:1px solid #d6e1ff}.result strong{font-size:24px;display:block}.result.warn{background:#fff4e7;border-color:#ffddb0}.result.danger{background:#fff0f0;border-color:#ffcccc}.miniGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.mini{background:#f6f8fb;border-radius:14px;padding:13px}.mini b{font-size:19px}.mini span{display:block;color:var(--muted);font-size:11px}
    .boardPage{background:#10131a;min-height:calc(100vh - 68px);padding:22px;border-radius:24px;color:#fff}.boardTop{display:flex;align-items:center;gap:12px;margin-bottom:18px}.boardTop h1{margin:0;font-size:26px}.boardGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.boardCard{background:#1b202b;border:1px solid #2b3342;border-radius:18px;padding:20px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between}.boardCard .bn{font-size:clamp(64px,8vw,108px);font-weight:950;line-height:.9;color:#dfe8ff;letter-spacing:-.07em}.boardCard .name{font-size:18px;font-weight:800}.boardCard .foot{color:#9aa8bf;font-size:12px}
    .adminGrid{display:grid;grid-template-columns:.75fr 1.25fr;gap:18px}.panel{padding:22px}.panel h2{margin:0 0 16px}.restaurantList{display:grid;gap:7px}.restaurantList button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left}.restaurantList button.active{border-color:#8caeff;background:#eef4ff}.adminNumber{font-size:80px;font-weight:950;letter-spacing:-.06em}.adminControls{display:flex;gap:9px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.event{display:grid;grid-template-columns:74px 1fr auto;gap:10px;border-top:1px solid var(--line);padding:10px 0;font-size:13px}.event:first-child{border-top:0}.event span{color:var(--muted)}
    .qrWrap{display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:center}.qrCanvas{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;min-height:205px;display:grid;place-items:center}.qrUrl{word-break:break-all;background:#f5f7fa;padding:10px;border-radius:10px;color:#536071;font-size:12px}.small{font-size:12px;color:var(--muted)}
    .integrations{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.integrationCard{padding:22px}.integrationCard .letter{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#eaf0ff;color:#2454d6;font-weight:900}.integrationCard h3{font-size:20px}.arch{margin-top:20px;padding:20px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}.archBox{padding:14px 18px;border:1px solid var(--line);border-radius:13px;background:#fff;font-weight:800}.arrow{color:var(--muted)}
    .modalBg{position:fixed;inset:0;background:rgba(12,16,24,.55);z-index:50;display:grid;place-items:center;padding:20px}.modal{max-width:520px;width:100%;background:#fff;border-radius:24px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modal h2{margin-top:0}.empty{padding:40px;text-align:center;color:var(--muted)}.hidden{display:none!important}.footer{color:var(--muted);font-size:12px;text-align:center;padding:0 0 32px}
    @media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.hero,.detail,.adminGrid{grid-template-columns:1fr}.boardGrid{grid-template-columns:repeat(2,1fr)}.integrations{grid-template-columns:1fr}.heroSide{display:none}}
    @media(max-width:650px){.wrap{padding:0 14px}.navlinks button span{display:none}.navin{height:60px}.brand{font-size:16px}.heroCard{padding:24px}.hero h1{font-size:39px}.grid{grid-template-columns:1fr}.current{font-size:66px}.boardGrid{grid-template-columns:1fr 1fr}.boardCard{min-height:175px;padding:14px}.boardCard .bn{font-size:60px}.boardCard .name{font-size:14px}.bigStatus{padding:22px}.ticketBox{padding:20px}.formgrid{grid-template-columns:1fr}.qrWrap{grid-template-columns:1fr}.qrCanvas{max-width:230px;margin:auto}.miniGrid{grid-template-columns:1fr 1fr 1fr}}
  </style>
</head>
<body>
  <nav class="nav"><div class="wrap navin">
    <button class="brand" onclick="go('/')" style="border:0;background:transparent;padding:0"><span class="mark">Q</span>叫號通 QueueHub <span class="demo">DEMO</span></button>
    <div class="spacer"></div>
    <div class="navlinks">
      <button data-nav="/" onclick="go('/')">⌂ <span>總覽</span></button>
      <button data-nav="/board" onclick="go('/board')">▦ <span>看板</span></button>
      <button data-nav="/admin" onclick="go('/admin')">⚙ <span>店家後台</span></button>
      <button data-nav="/integrations" onclick="go('/integrations')">↔ <span>系統整合</span></button>
    </div>
  </div></nav>
  <main><div class="wrap" id="app"></div></main>
  <div class="footer">QueueHub Prototype · 模擬資料，不代表任何真實休息站或餐廳</div>
  <div id="modal"></div>
<script>
const STORAGE='queuehub-demo-v2';
const channel=('BroadcastChannel' in window)?new BroadcastChannel('queuehub-demo'):null;
const venue={id:'beichen',name:'北辰休息站（Demo）',location:'示範場域'};
const seed=[
{id:'harbor-noodles',name:'港町麵屋',category:'麵食',current:152,recent:[151,150,149],status:'open',avg:45,updated:Date.now()-28000,integration:'manual'},
{id:'sunrise-bento',name:'日光便當',category:'便當',current:87,recent:[86,85,84],status:'open',avg:50,updated:Date.now()-62000,integration:'api'},
{id:'forest-curry',name:'森野咖哩',category:'飯類',current:214,recent:[213,212,210],status:'open',avg:55,updated:Date.now()-42000,integration:'gateway'},
{id:'cloud-burger',name:'雲朵漢堡',category:'速食',current:63,recent:[62,61,60],status:'open',avg:38,updated:Date.now()-16000,integration:'manual'},
{id:'stone-hotpot',name:'石庭小鍋',category:'鍋物',current:118,recent:[117,116,115],status:'paused',avg:65,updated:Date.now()-150000,integration:'manual'},
{id:'field-rice',name:'田野食堂',category:'飯類',current:36,recent:[35,34,33],status:'open',avg:48,updated:Date.now()-34000,integration:'api'},
{id:'north-coffee',name:'北辰咖啡',category:'飲品',current:301,recent:[300,299,298],status:'open',avg:30,updated:Date.now()-21000,integration:'api'},
{id:'moon-dessert',name:'月台甜點',category:'甜點',current:74,recent:[73,72,71],status:'open',avg:42,updated:Date.now()-87000,integration:'manual'}
];
let state=load(); let selectedAdmin=state.restaurants[0].id; let homeSearch=''; let homeCat='全部';
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE));if(s&&Array.isArray(s.restaurants))return s}catch(e){} return {restaurants:seed,events:[],integrations:{}}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state)); if(channel)channel.postMessage({type:'state',state});}
if(channel)channel.onmessage=e=>{if(e.data?.type==='state'){state=e.data.state;render()}};
window.addEventListener('storage',e=>{if(e.key===STORAGE){state=load();render()}});
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmtTime(ts){const d=new Date(ts);return d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}
function ago(ts){const s=Math.max(1,Math.floor((Date.now()-ts)/1000)); if(s<60)return s+' 秒前'; const m=Math.floor(s/60); if(m<60)return m+' 分鐘前'; return Math.floor(m/60)+' 小時前'}
function route(){const raw=(location.hash||'#/').slice(1);const [p,q='']=raw.split('?');return{path:p||'/',query:new URLSearchParams(q)}}
function go(path){location.hash='#'+path}
window.addEventListener('hashchange',render);
function activeNav(path){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',path===b.dataset.nav||(b.dataset.nav==='/'&&path.startsWith('/restaurant/'))))}
function render(){const r=route();activeNav(r.path);if(r.path==='/')home();else if(r.path==='/board')board();else if(r.path==='/admin')admin();else if(r.path==='/integrations')integrations();else if(r.path.startsWith('/restaurant/'))restaurant(r.path.split('/')[2],r.query);else notfound()}
function statusTag(x){return x.status==='paused'?'<span class="tag pause">暫停叫號</span>':'<span class="tag ok">叫號中</span>'}
function restaurantCard(x){return `<article class="card" onclick="go('/restaurant/${x.id}')"><div class="row between"><div><div class="restName">${esc(x.name)}</div><span class="tag">${esc(x.category)}</span></div>${statusTag(x)}</div><div class="current"><small>目前叫到</small><br>${x.current}</div><div class="recent">${x.recent.slice(0,3).map(n=>`<span>${n}</span>`).join('')}</div><div class="meta"><span>平均約 ${x.avg} 秒／號</span><span>${ago(x.updated)}</span></div></article>`}
function home(){const cats=['全部',...new Set(state.restaurants.map(r=>r.category))];const list=state.restaurants.filter(x=>(homeCat==='全部'||x.category===homeCat)&&(!homeSearch||x.name.includes(homeSearch)||x.category.includes(homeSearch)));const open=state.restaurants.filter(x=>x.status==='open').length;document.getElementById('app').innerHTML=`
<section class="hero"><div class="heroCard"><div class="eyebrow">SCAN · CHECK · RELAX</div><h1>不用擠在店門口，<br>也知道叫到幾號。</h1><p>掃描 QR Code，就能在手機查看整個休息站各餐廳目前叫號、最近號碼與估計等待時間。</p><div class="actions"><button class="btn primary" onclick="showVenueQR()">顯示場域 QR Code</button><button class="btn" onclick="go('/board')">開啟公共看板</button></div></div><div class="heroCard heroSide"><div class="sideStat"><span>目前營業中</span><b>${open}</b></div><div class="sideStat"><span>Demo 餐廳</span><b>${state.restaurants.length}</b></div><div class="sideStat"><span>同步模式</span><b style="font-size:18px">本機 Demo</b></div></div></section>
<div class="notice">目前為概念驗證版：同一瀏覽器分頁可即時同步。正式上線時需接餐廳 API／Webhook 或雲端即時資料庫，才能讓不同手機看到同一份叫號狀態。</div>
<div class="sectionHead"><div><h2>${venue.name}</h2><p>所有餐廳叫號總覽</p></div></div><div class="tools"><input class="search" placeholder="搜尋餐廳或分類…" value="${esc(homeSearch)}" oninput="homeSearch=this.value;home()"></div><div class="chips" style="margin-top:10px">${cats.map(c=>`<button class="chip ${homeCat===c?'active':''}" onclick="homeCat='${c}';home()">${c}</button>`).join('')}</div><div class="grid" style="margin-top:16px">${list.length?list.map(restaurantCard).join(''):'<div class="panel empty">找不到符合條件的餐廳</div>'}</div>`}
function restaurant(id,q){const x=state.restaurants.find(r=>r.id===id);if(!x)return notfound();const ticket=q.get('ticket')||'';document.getElementById('app').innerHTML=`<div class="sectionHead"><div><div class="eyebrow">${esc(x.category)} · ${venue.name}</div><h2>${esc(x.name)}</h2></div><div class="spacer"></div><button class="btn" onclick="showRestaurantQR('${x.id}')">QR Code</button></div><section class="detail"><div class="panel bigStatus"><div class="row between"><span class="tag">即時叫號 Demo</span>${statusTag(x)}</div><h1>目前叫到</h1><div class="bigNumber">${x.current}</div><div class="sub">最近叫號：${x.recent.slice(0,3).join('、')} · 更新於 ${fmtTime(x.updated)}</div><div class="miniGrid"><div class="mini"><b>${x.avg}s</b><span>平均每號</span></div><div class="mini"><b>${x.recent[0]??'-'}</b><span>上一號</span></div><div class="mini"><b>${x.integration.toUpperCase()}</b><span>Demo 資料來源</span></div></div></div><div class="panel ticketBox"><h2>我的取餐號碼</h2><p class="sub">掃描印在取餐單上的專屬 QR，可直接自動帶入號碼。</p><div class="field"><input id="ticketInput" inputmode="numeric" placeholder="例如 168" value="${esc(ticket)}"><button class="btn primary" onclick="calcTicket('${x.id}')">查看</button></div><div id="ticketResult"></div><div style="margin-top:20px"><label class="small">提醒時機（Demo UI）</label><div class="field" style="margin-top:7px"><select id="remindN"><option value="3">到號前 3 組</option><option value="5" selected>到號前 5 組</option><option value="10">到號前 10 組</option></select><button class="btn" onclick="enableReminder('${x.id}')">設定提醒</button></div></div></div></section>`;if(ticket)setTimeout(()=>calcTicket(id),0)}
function calcTicket(id){const x=state.restaurants.find(r=>r.id===id);const el=document.getElementById('ticketInput');const n=parseInt(el.value,10);const out=document.getElementById('ticketResult');if(!Number.isFinite(n)){out.innerHTML='<div class="result warn">請輸入有效的取餐號碼。</div>';return}const diff=n-x.current;if(diff>0){const mins=Math.max(1,Math.round(diff*x.avg/60));out.innerHTML=`<div class="result"><span class="small">你的號碼 ${n}</span><strong>前面約 ${diff} 組</strong><span>估計約 ${mins} 分鐘（依平均速度推算）</span></div>`}else if(diff===0){out.innerHTML='<div class="result"><strong>現在就是你的號碼</strong><span>請前往櫃台確認取餐。</span></div>'}else{out.innerHTML='<div class="result danger"><strong>可能已過號</strong><span>目前叫號已超過你的號碼，請直接洽店家。</span></div>'}}
async function enableReminder(id){const n=document.getElementById('remindN')?.value||5;let msg=`已設定：到號前 ${n} 組提醒。`;if('Notification' in window&&Notification.permission==='default'){try{const p=await Notification.requestPermission();msg+=p==='granted'?' 已允許瀏覽器通知。':' 未允許通知，僅保留 Demo 設定。'}catch(e){}}alert(msg+'\n正式版會由雲端推播服務發送通知。')}
function board(){document.getElementById('app').innerHTML=`<section class="boardPage"><div class="boardTop"><div><div style="color:#91a6d4;font-size:12px;font-weight:800">LIVE QUEUE BOARD · DEMO</div><h1>${venue.name} 即時叫號</h1></div><div class="spacer"></div><button class="btn" onclick="document.documentElement.requestFullscreen?.()">全螢幕</button></div><div class="boardGrid">${state.restaurants.map(x=>`<div class="boardCard"><div class="row between"><div class="name">${esc(x.name)}</div>${x.status==='paused'?'<span class="tag pause">暫停</span>':'<span class="tag ok">叫號中</span>'}</div><div class="bn">${x.current}</div><div class="foot">最近 ${x.recent.slice(0,3).join(' · ')}　·　${ago(x.updated)}</div></div>`).join('')}</div></section>`}
function admin(){const x=state.restaurants.find(r=>r.id===selectedAdmin)||state.restaurants[0];selectedAdmin=x.id;document.getElementById('app').innerHTML=`<div class="sectionHead"><div><div class="eyebrow">OPERATOR CONSOLE · DEMO</div><h2>店家叫號後台</h2><p>操作會同步到同一瀏覽器的其他分頁。</p></div></div><div class="adminGrid"><div class="panel"><h2>餐廳</h2><div class="restaurantList">${state.restaurants.map(r=>`<button class="${r.id===x.id?'active':''}" onclick="selectedAdmin='${r.id}';admin()"><b>${esc(r.name)}</b><br><span class="small">目前 ${r.current} · ${r.status==='paused'?'暫停':'叫號中'}</span></button>`).join('')}</div></div><div><div class="panel"><div class="row between"><div><div class="small">${esc(x.name)}</div><div class="adminNumber">${x.current}</div></div>${statusTag(x)}</div><div class="adminControls"><button class="btn primary" onclick="advance('${x.id}',1)">下一號 +1</button><button class="btn" onclick="advance('${x.id}',5)">+5</button><button class="btn warn" onclick="skip('${x.id}')">標記跳號</button><button class="btn ${x.status==='paused'?'primary':'danger'}" onclick="togglePause('${x.id}')">${x.status==='paused'?'恢復叫號':'暫停叫號'}</button></div><div class="formgrid"><input id="directNo" inputmode="numeric" placeholder="直接輸入號碼"><button class="btn" onclick="setNumber('${x.id}')">設定目前號碼</button></div></div><div class="panel" style="margin-top:18px"><h2>QR Code 產生器</h2><div class="formgrid"><select id="qrType" onchange="admin()"><option value="restaurant">餐廳 QR</option></select><input id="qrTicket" inputmode="numeric" placeholder="選填：取餐號碼，例如 168" oninput="updateAdminQR('${x.id}')"></div><div class="qrWrap"><div class="qrCanvas"><canvas id="adminQr"></canvas></div><div><b>掃描後直接開啟 ${esc(x.name)}</b><p class="small">如果填入取餐號碼，QR 會連號碼一起帶入。</p><div id="adminQrUrl" class="qrUrl"></div><div class="actions"><button class="btn" onclick="copyAdminQR()">複製連結</button><button class="btn" onclick="showVenueQR()">場域總覽 QR</button></div></div></div></div><div class="panel" style="margin-top:18px"><h2>最近操作</h2>${state.events.filter(e=>e.restaurantId===x.id).slice(0,8).map(e=>`<div class="event"><span>${fmtTime(e.at)}</span><b>${esc(e.label)}</b><span>${e.value??''}</span></div>`).join('')||'<div class="small">目前沒有操作紀錄</div>'}</div></div></div>`;setTimeout(()=>updateAdminQR(x.id),0)}
function mutate(id,label,fn,value){const x=state.restaurants.find(r=>r.id===id);if(!x)return;fn(x);x.updated=Date.now();state.events.unshift({restaurantId:id,label,value,at:Date.now()});state.events=state.events.slice(0,80);save();render()}
function advance(id,n){mutate(id,'叫號前進',x=>{for(let i=0;i<n;i++){x.recent.unshift(x.current);x.current++}x.recent=x.recent.slice(0,6)},'+'+n)}
function skip(id){mutate(id,'標記跳號',x=>{x.recent.unshift(x.current);x.current++;x.recent=x.recent.slice(0,6)},'跳過')}
function togglePause(id){mutate(id,'切換叫號狀態',x=>x.status=x.status==='paused'?'open':'paused')}
function setNumber(id){const n=parseInt(document.getElementById('directNo').value,10);if(!Number.isFinite(n))return alert('請輸入有效號碼');mutate(id,'直接設定號碼',x=>{x.recent.unshift(x.current);x.current=n;x.recent=x.recent.slice(0,6)},n)}
function base(){return location.href.split('#')[0]}
function buildRestaurantURL(id,ticket=''){return base()+'#/restaurant/'+encodeURIComponent(id)+(ticket?'?ticket='+encodeURIComponent(ticket):'')}
function makeQR(canvas,url,size=180){if(!canvas)return;if(window.QRCode?.toCanvas){QRCode.toCanvas(canvas,url,{width:size,margin:1,errorCorrectionLevel:'M'},e=>{if(e)console.error(e)})}else{canvas.replaceWith(Object.assign(document.createElement('div'),{textContent:'QR 模組載入失敗，請檢查網路連線'}))}}
function updateAdminQR(id){const ticket=document.getElementById('qrTicket')?.value.trim()||'';const url=buildRestaurantURL(id,ticket);const box=document.getElementById('adminQrUrl');if(box)box.textContent=url;setTimeout(()=>makeQR(document.getElementById('adminQr'),url,180),0)}
function copyAdminQR(){const t=document.getElementById('adminQrUrl')?.textContent||'';navigator.clipboard?.writeText(t);alert('已複製 QR 連結')}
function modalQR(title,url,note){document.getElementById('modal').innerHTML=`<div class="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><h2>${esc(title)}</h2><button class="btn" onclick="closeModal()">關閉</button></div><div class="qrCanvas" style="max-width:240px;margin:12px auto"><canvas id="modalQr"></canvas></div><div class="qrUrl">${esc(url)}</div><p class="small">${esc(note)}</p></div></div>`;setTimeout(()=>makeQR(document.getElementById('modalQr'),url,210),0)}
function showVenueQR(){modalQR('場域總覽 QR Code',base()+'#/','貼在休息站入口、座位區或桌面。掃描後查看所有餐廳目前叫號。')}
function showRestaurantQR(id){const x=state.restaurants.find(r=>r.id===id);modalQR((x?.name||'餐廳')+' QR Code',buildRestaurantURL(id),'貼在餐廳櫃台；也可把 ticket 參數印在每張取餐單上，自動帶入號碼。')}
function closeModal(){document.getElementById('modal').innerHTML=''}
function integrations(){document.getElementById('app').innerHTML=`<div class="sectionHead"><div><div class="eyebrow">INTEGRATION LAYER</div><h2>怎麼接到真正的餐廳叫號系統？</h2><p>不同店家可用不同接法，前台只吃統一 QueueStatus。</p></div></div><div class="integrations"><div class="panel integrationCard"><div class="letter">A</div><h3>API / Webhook</h3><p class="sub">店家既有 POS／叫號系統有 API 時，直接讀取 currentNumber；若支援 Webhook，叫號事件可即時推送。</p><div class="small">建議欄位：apiEndpoint、webhookUrl、pollingInterval、secretName</div></div><div class="panel integrationCard"><div class="letter">B</div><h3>店家平板同步</h3><p class="sub">沒有 API 的店家，用後台按「下一號」，雲端資料庫同步給所有手機與公共看板。</p><div class="small">適合先做 MVP，導入成本最低。</div></div><div class="panel integrationCard"><div class="letter">C</div><h3>Local Gateway</h3><p class="sub">舊式叫號機若能輸出 Serial、LAN、螢幕資料或列印事件，可用 Raspberry Pi／Edge Device 轉成標準事件。</p><div class="small">適合無法修改既有設備的店家。</div></div></div><div class="panel arch"><div class="archBox">餐廳叫號機 / POS</div><span class="arrow">→</span><div class="archBox">Integration Adapter</div><span class="arrow">→</span><div class="archBox">Queue API + Realtime DB</div><span class="arrow">→</span><div class="archBox">手機 / QR / 大看板</div></div><div class="panel" style="margin-top:18px"><h2>正式版資料模型</h2><div class="small"><b>Venue</b> → 多個 Restaurant<br><b>Restaurant</b> → 一個 QueueStatus + 多筆 QueueEvent<br><b>QueueStatus</b> → currentNumber / status / avgSecondsPerTicket / updatedAt<br><b>QueueEvent</b> → called / skipped / paused / resumed<br><b>IntegrationConfig</b> → type / endpoint / webhook / pollingInterval / secretName（真正 API Key 不存前端）</div></div>`}
function notfound(){document.getElementById('app').innerHTML='<div class="panel empty"><h2>找不到這個頁面</h2><button class="btn primary" onclick="go(\'/\')">回到總覽</button></div>'}
render();setInterval(()=>{if(route().path==='/board')board()},30000);
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
  <meta name="description" content="ReelScribe 是免費社群影片字幕工具。貼上公開影片連結，自動查找可複製字幕；沒有公開字幕時可使用本機 Whisper 備援。免登入、免 API Key。" />
  <meta name="keywords" content="影片轉字幕,YouTube字幕,短影片字幕,Reels字幕,TikTok字幕,Whisper,免費字幕工具,繁體中文字幕" />
  <link rel="canonical" href="https://paq6809.github.io/reelscribe/" />
  <link rel="sitemap" type="application/xml" href="./sitemap.xml" />

  <meta property="og:locale" content="zh_TW" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ReelScribe" />
  <meta property="og:title" content="ReelScribe｜免費社群影片字幕工具" />
  <meta property="og:description" content="貼上公開影片連結，快速取得可複製字幕；無公開字幕時可用本機 AI 備援。" />
  <meta property="og:url" content="https://paq6809.github.io/reelscribe/" />
  <meta property="og:image" content="https://paq6809.github.io/reelscribe/social-card.svg" />
  <meta property="og:image:alt" content="ReelScribe 免費社群影片字幕工具" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ReelScribe｜免費社群影片字幕工具" />
  <meta name="twitter:description" content="貼上公開影片連結，快速取得可複製字幕。" />
  <meta name="twitter:image" content="https://paq6809.github.io/reelscribe/social-card.svg" />

  <title>ReelScribe｜免費社群影片字幕工具</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://noembed.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./ui-polish.css" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "ReelScribe",
    "url": "https://paq6809.github.io/reelscribe/",
    "description": "免費社群影片字幕工具。貼上公開影片連結，自動查找可複製字幕；沒有公開字幕時可使用本機 Whisper 備援。",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Web",
    "inLanguage": "zh-Hant",
    "isAccessibleForFree": true,
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "TWD"
    },
    "featureList": [
      "公開影片字幕解析",
      "YouTube、Vimeo、Bilibili、Dailymotion、PeerTube 字幕來源",
      "本機 Whisper 語音辨識",
      "TXT、SRT、VTT 匯出",
      "手機 PWA 分享"
    ]
  }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="ReelScribe 首頁">
      <span class="brand-mark" aria-hidden="true">R</span>
      <span>
        <strong>ReelScribe</strong>
        <small>免費影片字幕工具</small>
      </span>
    </a>
    <div class="topbar-actions">
      <span class="privacy-pill">不傳 Cookie</span>
      <button id="share-site" class="button header-share" type="button" aria-label="分享 ReelScribe">分享</button>
    </div>
  </header>

  <main>
    <section class="hero shell">
      <div class="eyebrow">免費 · 免登入 · 無 API Key</div>
      <h1>貼上影片連結，<br /><span>取得可複製字幕。</span></h1>
      <p class="hero-copy">優先查找公開字幕；找不到時再使用本機 AI。</p>
    </section>

    <section class="workspace shell" aria-label="影片字幕工作區">
      <article class="card link-card">
        <div class="card-heading compact-heading">
          <div>
            <p class="step">開始</p>
            <h2>貼上影片連結</h2>
          </div>
        </div>
        <div class="input-row">
          <label class="sr-only" for="ig-url">社群影片連結</label>
          <input id="ig-url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="YouTube、Instagram、TikTok、Vimeo…" aria-describedby="url-status" />
          <button id="paste-url" class="button ghost" type="button">貼上</button>
          <button id="check-url" class="button secondary" type="button" aria-controls="results">取得字幕</button>
        </div>
        <div id="url-status" class="inline-status" role="status" aria-live="polite"></div>
        <div id="verified-link-actions" class="link-actions" hidden>
          <a id="open-instagram" class="text-link" target="_blank" rel="noopener noreferrer">開啟原始頁面</a>
          <button id="focus-upload" class="text-link button-link" type="button">改用本機備援</button>
        </div>
      </article>

      <details id="fallback-tools" class="fallback-details">
        <summary>
          <span class="fallback-summary-copy">
            <span>沒有公開字幕？</span>
            <small>使用本機影片、分頁音訊或麥克風</small>
          </span>
        </summary>

        <article class="card upload-card">
          <div class="card-heading">
            <div>
              <p class="step">本機備援</p>
              <h2>Whisper 辨識</h2>
            </div>
            <span class="required">檔案不上傳</span>
          </div>

          <label id="drop-zone" class="drop-zone" for="media-file">
            <input id="media-file" type="file" accept="video/*,audio/*,.mp4,.mov,.m4v,.webm,.mp3,.m4a,.wav,.aac" />
            <span class="upload-symbol" aria-hidden="true">↑</span>
            <strong>選擇影片或音訊</strong>
            <span>也可以拖曳檔案</span>
            <small>只在目前裝置處理</small>
          </label>

          <div id="file-panel" class="file-panel" hidden>
            <div class="preview-wrap">
              <video id="media-preview" controls playsinline preload="metadata"></video>
            </div>
            <div class="file-meta">
              <strong id="file-name"></strong>
              <span id="file-detail"></span>
              <button id="remove-file" class="text-link button-link danger" type="button">移除檔案</button>
            </div>
          </div>

          <div class="settings-grid">
            <label>
              <span>辨識模式</span>
              <select id="model-select">
                <option value="onnx-community/whisper-tiny">快速模式（建議手機）</option>
                <option value="onnx-community/whisper-base">品質模式（較慢）</option>
              </select>
            </label>
            <label>
              <span>影片語言</span>
              <select id="language-select">
                <option value="auto">自動偵測</option>
                <option value="chinese">中文</option>
                <option value="english">英文</option>
                <option value="japanese">日文</option>
                <option value="korean">韓文</option>
              </select>
            </label>
            <label class="switch-line">
              <input id="prefer-gpu" type="checkbox" checked />
              <span>支援時使用 WebGPU 加速</span>
            </label>
          </div>

          <button id="transcribe" class="button primary wide" type="button" disabled>開始本機辨識</button>

          <div id="progress-panel" class="progress-panel" hidden>
            <div class="progress-copy">
              <strong id="progress-title">準備中</strong>
              <span id="progress-detail">正在初始化...</span>
            </div>
            <div class="progress-track" aria-hidden="true"><div id="progress-bar"></div></div>
            <p id="progress-note" class="muted small"></p>
          </div>
        </article>
      </details>

      <p class="compact-trust">只處理公開字幕來源，不要求密碼、Cookie 或私人 Token。</p>
    </section>

    <section id="results" class="results shell" hidden>
      <div class="results-heading">
        <div>
          <p class="step">結果</p>
          <h2>完整字幕</h2>
          <p id="result-stats" class="muted"></p>
        </div>
        <div class="action-row">
          <button id="copy-text" class="button secondary" type="button">複製全文</button>
          <button id="download-txt" class="button ghost" type="button">TXT</button>
          <button id="download-srt" class="button ghost" type="button">SRT</button>
          <button id="download-vtt" class="button ghost" type="button">VTT</button>
        </div>
      </div>

      <div class="result-grid">
        <article class="card transcript-card">
          <div class="section-label-row">
            <label for="full-transcript">可編輯全文</label>
            <button id="rebuild-text" class="text-link button-link" type="button">依時間軸重建</button>
          </div>
          <textarea id="full-transcript" spellcheck="true" aria-label="完整字幕文字"></textarea>
        </article>

        <article class="card timeline-card">
          <div class="section-label-row">
            <span>時間軸</span>
            <span id="segment-count" class="muted small"></span>
          </div>
          <div id="segments" class="segments"></div>
        </article>
      </div>
    </section>
  </main>

  <footer class="footer shell">
    <span>ReelScribe · 免費開源字幕工具</span>
    <button id="footer-share" class="text-link button-link" type="button" onclick="document.querySelector('#share-site')?.click()">分享給朋友</button>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./app.js"></script>
  <script type="module" src="./capture.js"></script>
  <script type="module" src="./traditional.js"></script>
  <script type="module" src="./universal-link.js"></script>
  <script type="module" src="./ui.js"></script>
  <script type="module" src="./share.js"></script>
</body>
</html>
